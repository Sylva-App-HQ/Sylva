            window.addEventListener('pointercancel', onPointerEnd);

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.1;
                const newScale = e.deltaY < 0 ? Math.min(scale * zoomFactor, 3.0) : Math.max(scale / zoomFactor, 0.3);

                const mouseWorldX = (e.clientX - panX) / scale;
                const mouseWorldY = (e.clientY - panY) / scale;

                scale = newScale;
                panX = e.clientX - mouseWorldX * scale;
                panY = e.clientY - mouseWorldY * scale;

                updateTransform();
                zoomIndicator.innerText = `Zoom: ${Math.round(scale * 100)}%`;
            }, { passive: false });

            // Sidebar Controls
            document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                treesSidebar.classList.remove('open');
                sidebar.classList.toggle('open');
            });

            document.getElementById('btn-close-sidebar').addEventListener('click', () => {
                sidebar.classList.remove('open');
            });

            document.getElementById('btn-toggle-trees').addEventListener('click', () => {
                sidebar.classList.remove('open');
                treesSidebar.classList.toggle('open');
            });

            document.getElementById('btn-close-trees').addEventListener('click', () => {
                treesSidebar.classList.remove('open');
            });

            document.getElementById('btn-auto-tidy').addEventListener('click', () => {
                if (isForestView) return;
                autoTidyTopDown();
                sidebar.classList.remove('open');
            });

            document.getElementById('btn-close-panel').addEventListener('click', () => {
                sidePanel.classList.remove('open');
            });

            // Node Editor Save Button
            document.getElementById('btn-save').addEventListener('click', () => {
                if (selectedNodeId) {
                    const node = nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        node.title = titleInput.value.trim() || 'Untitled';
                        node.description = descInput.value.trim();
                        node.type = editingNodeType;
                        if (editingNodeType === 'fruit') {
                            node.isRipe = fruitRipeToggle.checked;
                        } else if (editingNodeType === 'seed') {
                            node.childTreeId = seedLinkedTreeSelect.value || node.childTreeId || ('tree_' + node.id);
                        }
                        saveNodes();
                        render();
                        renderSidebar();
                        renderBreadcrumbs();
                        updateMinimap();
                    }
                }
                sidePanel.classList.remove('open');
            });

            document.getElementById('btn-delete').addEventListener('click', () => {
                if (selectedNodeId && selectedNodeId !== 'root') {
                    const toDelete = new Set([selectedNodeId]);
                    let added;
                    do {
                        added = false;
                        nodes.forEach(n => {
                            if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) {
                                toDelete.add(n.id);
                                added = true;
                            }
                        });
                    } while (added);

                    nodes = nodes.filter(n => !toDelete.has(n.id));
                    selectedNodeId = null;
                    saveNodes();
                    sidePanel.classList.remove('open');
                    render();
                    renderSidebar();
                    updateMinimap();
                }
            });

            // Nursery: Import Tree File
            document.getElementById('btn-menu-import').addEventListener('click', () => {
                importFileInput.click();
            });

            importFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported) && imported.length > 0 && imported[0].id) {
                            const newTreeId = 'tree_' + Date.now();
                            treeRegistry[newTreeId] = {
                                id: newTreeId,
                                title: file.name.replace('.json', ''),
                                species: 'oak',
                                season: 'spring',
                                x: 0,
                                y: 80,
                                zIndex: 2,
                                harvestBasket: [],
                                nodes: imported
                            };

                            const lib = loadLibrary();
                            lib[file.name] = imported;
                            saveLibrary(lib);
                            renderTreesList();

                            currentTreeId = newTreeId;
                            activeTreePath = [newTreeId];
                            nodes = imported;
                            selectedNodeId = null;
                            saveNodes();

                            isForestView = false;
                            applySeasonVisuals();
                            updateCenterButtonState();
                            render();
                            renderSidebar();
                            renderBreadcrumbs();
                            resetMinimapCamera();
                            autoTidyTopDown();
                            treesSidebar.classList.remove('open');
                        } else {
                            alert('Invalid tree JSON format.');
                        }
                    } catch (err) {
                        alert('Could not parse JSON file.');
                    }
                    importFileInput.value = '';
                };
                reader.readAsText(file);
            });

            // Nursery: Save Tree File
            document.getElementById('btn-menu-save').addEventListener('click', () => {
                const activeTree = getActiveTree();
                const defaultName = (activeTree.title || 'My_Tree').replace(/[^a-z0-9_\-]/gi, '_') + '.json';
                const inputName = prompt('Enter file name to save tree:', defaultName);
                if (!inputName) return;

                const finalName = inputName.endsWith('.json') ? inputName : `${inputName}.json`;

                const lib = loadLibrary();
                lib[finalName] = JSON.parse(JSON.stringify(nodes));
                saveLibrary(lib);
                renderTreesList();

                const blob = new Blob([JSON.stringify(nodes, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = finalName;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function updateTransform() {
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function resetMinimapCamera() {
            if (isForestView) {
                const treeKeys = Object.keys(treeRegistry);
                if (treeKeys.length === 0) return;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                treeKeys.forEach(k => {
                    const t = treeRegistry[k];
                    minX = Math.min(minX, t.x || 0);
                    maxX = Math.max(maxX, (t.x || 0) + 220);
                    minY = Math.min(minY, t.y || 0);
                    maxY = Math.max(maxY, (t.y || 0) + 260);
                });
                const pad = 100;
                const w = Math.max(maxX - minX + pad * 2, 600);
                const h = Math.max(maxY - minY + pad * 2, 600);
                pipView.w = Math.max(w, h);
                pipView.h = Math.max(w, h);
                pipView.x = (minX + maxX) / 2 - pipView.w / 2;
                pipView.y = (minY + maxY) / 2 - pipView.h / 2;
                updateMinimap();
                return;
            }

            if (nodes.length === 0) return;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            nodes.forEach(n => {
                minX = Math.min(minX, n.x);
                maxX = Math.max(maxX, n.x + 215);
                minY = Math.min(minY, n.y);
                maxY = Math.max(maxY, n.y + 70);
            });

            const pad = 80;
            const treeW = maxX - minX + pad * 2;
            const treeH = maxY - minY + pad * 2;
            const maxDimension = Math.max(treeW, treeH, 400);

            pipView.w = maxDimension;
            pipView.h = maxDimension;
            pipView.x = (minX + maxX) / 2 - pipView.w / 2;
            pipView.y = (minY + maxY) / 2 - pipView.h / 2;

            updateMinimap();
        }

        function setupPipEvents() {
            const pipTouches = new Map();

            pipContainer.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                pipTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                pipPointerMoved = false;

                const now = Date.now();
                if (pipTouches.size === 1 && (now - pipLastClickTime) < 300) {
                    pipIsDoubleTap = true;
                    if (pipSingleClickTimer) {
                        clearTimeout(pipSingleClickTimer);
                        pipSingleClickTimer = null;
                    }
                    resetMinimapCamera();
                    pipLastClickTime = 0;
                } else {
                    pipIsDoubleTap = false;
                    pipLastClickTime = now;
                }

                if (pipTouches.size === 1) {
                    isPipPanning = true;
                    pipStartPointerX = e.clientX;
                    pipStartPointerY = e.clientY;
                    pipStartViewX = pipView.x;
                    pipStartViewY = pipView.y;
                } else if (pipTouches.size === 2) {
                    isPipPanning = false;
                    if (pipSingleClickTimer) {
                        clearTimeout(pipSingleClickTimer);
                        pipSingleClickTimer = null;
                    }
                    const [t1, t2] = Array.from(pipTouches.values());
                    pipInitialPinchDist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
                    pipInitialW = pipView.w;
                    pipInitialH = pipView.h;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (pipTouches.has(e.pointerId)) {
                    pipTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                }

                if (pipTouches.size === 2 && pipInitialPinchDist) {
                    pipPointerMoved = true;
                    const [t1, t2] = Array.from(pipTouches.values());
                    const currentDist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
                    const factor = pipInitialPinchDist / currentDist;

                    const newW = pipInitialW * factor;
                    const newH = pipInitialH * factor;

                    pipView.x += (pipView.w - newW) / 2;
                    pipView.y += (pipView.h - newH) / 2;
                    pipView.w = newW;
                    pipView.h = newH;

                    updateMinimap();
                } else if (isPipPanning && pipTouches.size === 1) {
                    const rect = pipContainer.getBoundingClientRect();
                    const moveDist = Math.hypot(e.clientX - pipStartPointerX, e.clientY - pipStartPointerY);
                    if (moveDist > 6) {
                        pipPointerMoved = true;
                        if (pipSingleClickTimer) {
                            clearTimeout(pipSingleClickTimer);
                            pipSingleClickTimer = null;
                        }
                    }

                    const dx = (e.clientX - pipStartPointerX) * (pipView.w / rect.width);
                    const dy = (e.clientY - pipStartPointerY) * (pipView.h / rect.height);

                    pipView.x = pipStartViewX - dx;
                    pipView.y = pipStartViewY - dy;
                    updateMinimap();
                }
            });

            const onPipEnd = (e) => {
                if (!pipPointerMoved && !pipIsDoubleTap && isPipPanning && (e.target === pipContainer || (e.target && e.target.tagName === 'svg'))) {
                    const clientX = e.clientX;
                    const clientY = e.clientY;
                    const rect = pipContainer.getBoundingClientRect();

                    pipSingleClickTimer = setTimeout(() => {
                        const relX = (clientX - rect.left) / rect.width;
                        const relY = (clientY - rect.top) / rect.height;

                        const targetWorldX = pipView.x + relX * pipView.w;
                        const targetWorldY = pipView.y + relY * pipView.h;

                        panX = (window.innerWidth / 2) - (targetWorldX * scale);
                        panY = (window.innerHeight / 2) - (targetWorldY * scale);
                        updateTransform();
                        pipSingleClickTimer = null;
                    }, 280);
                }

                pipTouches.delete(e.pointerId);
                if (pipTouches.size < 2) pipInitialPinchDist = null;
                if (pipTouches.size === 0) {
                    isPipPanning = false;
                    pipIsDoubleTap = false;
                }
            };

            window.addEventListener('pointerup', onPipEnd);
            window.addEventListener('pointercancel', onPipEnd);

            pipContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1;

                const newW = pipView.w * zoomFactor;
                const newH = pipView.h * zoomFactor;

                pipView.x += (pipView.w - newW) / 2;
                pipView.y += (pipView.h - newH) / 2;
                pipView.w = newW;
                pipView.h = newH;

                updateMinimap();
            }, { passive: false });
        }

        function updateMinimap() {
            minimapSvg.setAttribute('viewBox', `${pipView.x} ${pipView.y} ${pipView.w} ${pipView.h}`);
            minimapSvg.innerHTML = '';

            // Forest View Minimap
            if (isForestView) {
                const treeKeys = Object.keys(treeRegistry);
                treeKeys.forEach((tId) => {
                    const tree = treeRegistry[tId];
                    const isSelected = (selectedTreePlotId === tId);

                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.style.cursor = 'pointer';

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', (tree.x || 0) + 110);
                    circle.setAttribute('cy', (tree.y || 0) + 130);
                    circle.setAttribute('r', isSelected ? '46' : '36');
                    circle.setAttribute('fill', isSelected ? 'rgba(56, 189, 248, 0.45)' : 'rgba(74, 222, 128, 0.4)');
                    circle.setAttribute('stroke', isSelected ? '#38bdf8' : '#22c55e');
                    circle.setAttribute('stroke-width', '4');

                    g.appendChild(circle);

                    g.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        if (pipSingleClickTimer) {
                            clearTimeout(pipSingleClickTimer);
                            pipSingleClickTimer = null;
                        }
                        selectTreePlot(tId);
                        panX = (window.innerWidth / 2) - (((tree.x || 0) + 110) * scale);
                        panY = (window.innerHeight / 2) - (((tree.y || 0) + 130) * scale);
                        updateTransform();
                    });

                    minimapSvg.appendChild(g);
                });
                return;
            }

            if (nodes.length === 0) return;

            // Canopy Minimap
            nodes.forEach(node => {
                if (node.parentId) {
                    const parent = nodes.find(n => n.id === node.parentId);
                    if (parent) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', parent.x + 107);
                        line.setAttribute('y1', parent.y + 35);
                        line.setAttribute('x2', node.x + 107);
                        line.setAttribute('y2', node.y + 35);
                        line.setAttribute('stroke', '#64748b');
                        line.setAttribute('stroke-width', String(Math.max(pipView.w * 0.007, 3)));
                        minimapSvg.appendChild(line);
                    }
                }
            });

            const radius = Math.max(pipView.w * 0.024, 7);
            nodes.forEach(node => {
                const isSelected = node.id === selectedNodeId;
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.style.cursor = 'pointer';

                const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                hit.setAttribute('cx', node.x + 107);
                hit.setAttribute('cy', node.y + 35);
                hit.setAttribute('r', String(radius * 2.8));
                hit.setAttribute('fill', 'transparent');

                let dotColor = '#38bdf8';
                if (node.type === 'fruit') {
                    dotColor = node.isRipe ? '#10b981' : '#f59e0b';
                } else if (node.type === 'seed') {
                    dotColor = '#c084fc';
                }

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', node.x + 107);
                circle.setAttribute('cy', node.y + 35);
                circle.setAttribute('r', String(isSelected ? radius * 1.4 : radius));
                circle.setAttribute('fill', isSelected ? '#ef4444' : dotColor);
                if (isSelected) {
                    circle.setAttribute('stroke', '#ffffff');
                    circle.setAttribute('stroke-width', String(radius * 0.35));
                }

                g.appendChild(hit);
                g.appendChild(circle);

                g.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    if (pipSingleClickTimer) {
                        clearTimeout(pipSingleClickTimer);
                        pipSingleClickTimer = null;
                    }
                    selectNode(node.id, false);
                    focusNodeAsHeader(node);
                });

                minimapSvg.appendChild(g);
            });
        }

        function renderSidebar() {
            const sorted = isForestView ? [] : [...nodes].sort((a, b) => a.title.localeCompare(b.title));
            sidebarList.innerHTML = '';

            if (isForestView) {
                sidebarList.innerHTML = '<div style="font-size:12px; color:var(--text-secondary); padding:12px;">Forest overview active. Double-tap any tree to view settings, or long-press to enter.</div>';
                return;
            }

            const activeTree = getActiveTree();
            const species = SPECIES_CONFIG[activeTree.species || 'oak'] || SPECIES_CONFIG.oak;

            sorted.forEach(node => {
                const item = document.createElement('div');
                item.className = `sidebar-item ${node.id === selectedNodeId ? 'selected' : ''}`;
                
                let icon = '🍃';
                if (node.type === 'fruit') icon = node.isRipe ? species.ripeIcon : species.fruitIcon;
                else if (node.type === 'seed') icon = '🌱';

                item.innerHTML = `
                    <div class="sidebar-item-content">
                        <div class="sidebar-item-title">${icon} ${escapeHTML(node.title)}</div>
                        <div class="sidebar-item-desc">${escapeHTML(node.description || 'No description')}</div>
                    </div>
                `;

                item.addEventListener('click', () => {
                    selectNode(node.id, false);
                    centerOnNode(node);
                    sidebar.classList.remove('open');
                });

                sidebarList.appendChild(item);
            });
        }

        function renderTreesList() {
            const lib = loadLibrary();
            const keys = Object.keys(lib).sort((a, b) => a.localeCompare(b));
            treesList.innerHTML = '';

            if (keys.length === 0) {
                treesList.innerHTML = '<div style="font-size: 12px; color: var(--text-secondary); padding: 12px;">No saved trees yet. Click "Save Tree" above to vault one.</div>';
                return;
            }

            keys.forEach(fileName => {
                const treeData = lib[fileName];
                const count = Array.isArray(treeData) ? treeData.length : 0;

                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.innerHTML = `
                    <div class="sidebar-item-content">
                        <div class="sidebar-item-title">🌳 ${escapeHTML(fileName)}</div>
                        <div class="sidebar-item-desc">${count} node${count === 1 ? '' : 's'}</div>
                    </div>
                `;

                item.addEventListener('click', () => {
                    const loadedTreeId = 'tree_' + fileName.replace(/[^a-z0-9_\-]/gi, '_');
                    treeRegistry[loadedTreeId] = {
                        id: loadedTreeId,
                        title: fileName.replace('.json', ''),
                        species: 'oak',
                        season: 'spring',
                        x: 0,
                        y: 80,
                        zIndex: 2,
                        harvestBasket: [],
                        nodes: JSON.parse(JSON.stringify(treeData))
                    };

                    currentTreeId = loadedTreeId;
                    activeTreePath = [loadedTreeId];
                    nodes = treeRegistry[loadedTreeId].nodes;
                    selectedNodeId = null;

                    isForestView = false;
                    applySeasonVisuals();
                    updateCenterButtonState();
                    saveNodes();
                    render();
                    renderSidebar();
                    renderBreadcrumbs();
                    resetMinimapCamera();
                    autoTidyTopDown();
                    treesSidebar.classList.remove('open');
                });

                treesList.appendChild(item);
            });
        }

        function autoTidyTopDown() {
            if (isForestView) return;
            const root = nodes.find(n => n.parentId === null);
            if (!root) return;

            const levels = {};
            function assign(id, lvl) {
                if (!levels[lvl]) levels[lvl] = [];
                levels[lvl].push(id);
                nodes.filter(n => n.parentId === id).forEach(c => assign(c.id, lvl + 1));
            }
            assign(root.id, 0);

            const startX = 0;
            const startY = 100;
            const spacingX = 245;
            const spacingY = 150;

            Object.keys(levels).forEach(lvlStr => {
                const lvl = parseInt(lvlStr);
                const ids = levels[lvl];
                const totalWidth = ids.length * spacingX;
                ids.forEach((id, idx) => {
                    const n = nodes.find(x => x.id === id);
                    if (n) {
                        n.x = startX - (totalWidth / 2) + (idx * spacingX) + (spacingX / 2) - 107;
                        n.y = startY + (lvl * spacingY);
                    }
                });
            });

            saveNodes();
            render();
            resetMinimapCamera();
            panX = window.innerWidth / 2;
            panY = 100;
            updateTransform();
        }

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA ServiceWorker registered', reg))
                    .catch(err => console.error('PWA registration failed', err));
            }
        }

        init();
    </script>
