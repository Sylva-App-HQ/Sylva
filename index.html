<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sylva</title>
    
    <!-- PWA Settings with Cache-Busted Manifest -->
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="application-name" content="Sylva">
    <meta name="apple-mobile-web-app-title" content="Sylva">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.88);
            --panel-border: rgba(51, 65, 85, 0.65);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --node-bg: #1e293b;
            --node-border: #475569;
            --node-selected: #38bdf8;
            --line-color: #64748b;
            --danger: #ef4444;

            /* Botanical Base Variables */
            --fruit-color: #f59e0b;
            --fruit-ripe: #10b981;
            --seed-color: #c084fc;

            /* Active Season Tokens */
            --season-accent: #22c55e;
            --season-glow: rgba(34, 197, 94, 0.25);
            --season-border: rgba(34, 197, 94, 0.4);
        }

        body.season-spring {
            --season-accent: #4ade80;
            --season-glow: rgba(74, 222, 128, 0.3);
            --season-border: rgba(74, 222, 128, 0.45);
        }

        body.season-summer {
            --season-accent: #10b981;
            --season-glow: rgba(16, 185, 129, 0.3);
            --season-border: rgba(16, 185, 129, 0.45);
        }

        body.season-fall {
            --season-accent: #f59e0b;
            --season-glow: rgba(245, 158, 11, 0.3);
            --season-border: rgba(245, 158, 11, 0.45);
        }

        body.season-winter {
            --season-accent: #38bdf8;
            --season-glow: rgba(56, 189, 248, 0.25);
            --season-border: rgba(148, 163, 184, 0.45);
            --node-bg: #182234;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-primary);
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Unified World Plane */
        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            will-change: transform;
        }

        svg#connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        #nodes-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Symmetric 3-Column Top Bar */
        .toolbar {
            position: absolute;
            top: env(safe-area-inset-top, 14px);
            left: 12px;
            right: 12px;
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            gap: 10px;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            padding: 8px 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .toolbar button {
            width: 100%;
            height: 38px;
            background: #334155;
            color: var(--text-primary);
            border: 1px solid var(--node-border);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .toolbar button:active {
            background: var(--accent);
            color: #0f172a;
        }

        #btn-center-action.mode-forest {
            background: #1e3a2f;
            border-color: #22c55e;
            color: #4ade80;
        }

        #btn-center-action.mode-forest:active {
            background: #22c55e;
            color: #0f172a;
        }

        /* Breadcrumb Navigation & Season Bar */
        .breadcrumb-bar {
            position: absolute;
            top: calc(env(safe-area-inset-top, 14px) + 58px);
            left: 12px;
            right: 12px;
            z-index: 19;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 10px;
        }

        .breadcrumb-nav-group {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            touch-action: pan-x;
        }

        .breadcrumb-btn-up {
            background: #1e293b;
            border: 1px solid var(--node-border);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .breadcrumb-trail {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            white-space: nowrap;
        }

        .breadcrumb-crumb {
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.15s ease;
            font-weight: 500;
        }

        .breadcrumb-crumb:hover, .breadcrumb-crumb.active {
            color: var(--text-primary);
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: var(--line-color);
            font-size: 10px;
        }

        .season-badge-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--season-border);
            color: var(--season-accent);
            padding: 4px 9px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 0 10px var(--season-glow);
            transition: all 0.2s ease;
        }

        /* Node Elements */
        .node {
            position: absolute;
            background: var(--node-bg);
            border: 2px solid var(--node-border);
            border-radius: 12px;
            padding: 12px 14px;
            width: 215px;
            cursor: grab;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s, box-shadow 0.2s;
            will-change: transform;
            pointer-events: auto;
        }

        .node.selected {
            border-color: var(--node-selected);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .node.dragging {
            cursor: grabbing;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }

        .node.type-fruit {
            border-color: rgba(245, 158, 11, 0.45);
        }

        .node.type-fruit.ripe {
            border-color: var(--fruit-ripe);
            background: rgba(16, 185, 129, 0.08);
        }

        .node.type-fruit.ripe .node-title {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .node.type-seed {
            border-color: rgba(192, 132, 252, 0.5);
            border-style: dashed;
        }

        .node-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 4px;
        }

        .node-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .badge-leaf {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }

        .badge-fruit {
            background: rgba(245, 158, 11, 0.18);
            color: var(--fruit-color);
        }

        .badge-fruit.ripe {
            background: rgba(16, 185, 129, 0.18);
            color: var(--fruit-ripe);
        }

        .badge-seed {
            background: rgba(192, 132, 252, 0.18);
            color: var(--seed-color);
        }

        .fruit-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--fruit-ripe);
            pointer-events: auto;
        }

        .seed-open-btn {
            background: rgba(192, 132, 252, 0.18);
            border: 1px solid var(--seed-color);
            color: var(--seed-color);
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 6px;
            pointer-events: auto;
        }

        .node-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            flex: 1;
        }

        .node-snippet {
            font-size: 11px;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            pointer-events: none;
        }

        /* Botanical Vector Trees on Forest Floor */
        .botanical-tree-plot {
            position: absolute;
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            pointer-events: auto;
            will-change: transform;
            transition: box-shadow 0.2s ease;
        }

        .botanical-tree-plot.dragging {
            cursor: grabbing;
            z-index: 50;
        }

        .botanical-tree-svg {
            width: 190px;
            height: 220px;
            filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.65));
            overflow: visible;
            pointer-events: none;
        }

        .botanical-tree-card {
            margin-top: -12px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            padding: 8px 14px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            width: 200px;
            z-index: 5;
            pointer-events: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .botanical-tree-plot.selected .botanical-tree-card {
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .botanical-tree-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 2px;
        }

        .botanical-tree-stats {
            font-size: 10px;
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        /* Sidebars */
        .sidebar {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 290px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            touch-action: pan-y;
        }

        .sidebar-left {
            left: 0;
            border-right: 1px solid var(--panel-border);
            transform: translateX(-100%);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-left.open { transform: translateX(0); }

        .sidebar-right {
            right: 0;
            border-left: 1px solid var(--panel-border);
            transform: translateX(100%);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-right.open { transform: translateX(0); }

        .sidebar-header {
            padding: calc(env(safe-area-inset-top, 14px) + 12px) 16px 14px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex: 1;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            touch-action: pan-y;
        }

        .sidebar-item {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-item:active, .sidebar-item.selected {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
        }

        .sidebar-item-content { flex: 1; overflow: hidden; }

        .sidebar-item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-item-desc {
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .trees-menu-actions {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid var(--panel-border);
        }

        .action-button-primary {
            width: 100%;
            text-align: center;
            background: #1e293b;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        .trees-section-header {
            padding: 12px 14px 4px 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        /* Minimap */
        .pip-minimap {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 14px) + 12px);
            left: 14px;
            width: 140px;
            height: 140px;
            aspect-ratio: 1 / 1;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1.5px solid var(--panel-border);
            border-radius: 14px;
            z-index: 15;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            cursor: pointer;
            touch-action: none;
        }

        .pip-minimap svg { width: 100%; height: 100%; display: block; }

        .zoom-indicator {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 14px) + 12px);
            right: 14px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            z-index: 10;
            pointer-events: none;
        }

        /* Bottom Sheets */
        .side-panel {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 85vh;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border-top: 1px solid var(--panel-border);
            border-radius: 20px 20px 0 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            touch-action: pan-y;
        }

        .side-panel.open { transform: translateY(0); }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 { font-size: 16px; font-weight: 600; }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            padding: 4px 8px;
        }

        .panel-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            touch-action: pan-y;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-group input, .input-group textarea, .input-group select {
            background: #0f172a;
            border: 1px solid var(--node-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            touch-action: auto;
        }

        .input-group textarea { resize: none; min-height: 80px; }

        .type-selector-group { display: flex; gap: 8px; }

        .type-radio-btn {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border: 1px solid var(--node-border);
            border-radius: 8px;
            background: #0f172a;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .type-radio-btn.active[data-type="leaf"] {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }

        .type-radio-btn.active[data-type="fruit"] {
            border-color: var(--fruit-color);
            background: rgba(245, 158, 11, 0.15);
            color: var(--fruit-color);
        }

        .type-radio-btn.active[data-type="seed"] {
            border-color: var(--seed-color);
            background: rgba(192, 132, 252, 0.15);
            color: var(--seed-color);
        }

        .panel-footer {
            padding: 14px 20px calc(env(safe-area-inset-bottom, 14px) + 10px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-danger { background: #7f1d1d; border-color: #991b1b; }
        .btn-harvest { background: #b45309; border-color: #d97706; }
        .btn-prune { background: #334155; border-color: #64748b; }
    </style>
</head>
<body class="season-spring">

    <div id="canvas-container">
        <div id="world">
            <svg id="connections"></svg>
            <div id="nodes-layer"></div>
        </div>
    </div>

    <!-- Symmetric Top Action Toolbar (Equal Dimensions & Spacing) -->
    <div class="toolbar">
        <button id="btn-toggle-sidebar">☰ Nodes</button>
        <button id="btn-center-action">+ Add Branch</button>
        <button id="btn-toggle-trees">Nursery ▾</button>
        <input type="file" id="import-file-input" accept=".json" style="display: none;">
    </div>

    <!-- Breadcrumb Hierarchy & Season Bar -->
    <div class="breadcrumb-bar" id="breadcrumb-bar">
        <div class="breadcrumb-nav-group">
            <button class="breadcrumb-btn-up" id="btn-tree-up">▲ Up</button>
            <div class="breadcrumb-trail" id="breadcrumb-trail"></div>
        </div>
        <button class="season-badge-btn" id="btn-season-toggle">🌸 Spring</button>
    </div>

    <!-- Left Sidebar: Alphabetical Node Index -->
    <div class="sidebar sidebar-left" id="sidebar">
        <div class="sidebar-header">
            <h3>Node Index (A–Z)</h3>
            <button class="btn-sub-action" id="btn-auto-tidy">Auto-Tidy</button>
            <button class="close-btn" id="btn-close-sidebar">&times;</button>
        </div>
        <div class="sidebar-list" id="sidebar-list"></div>
    </div>

    <!-- Right Sidebar: Nursery Vault -->
    <div class="sidebar sidebar-right" id="trees-sidebar">
        <div class="sidebar-header">
            <h3>Nursery</h3>
            <button class="close-btn" id="btn-close-trees">&times;</button>
        </div>
        <div class="trees-menu-actions">
            <button class="action-button-primary" id="btn-menu-import">📂 Import Tree</button>
            <button class="action-button-primary" id="btn-menu-save">💾 Save Tree</button>
        </div>
        <div class="trees-section-header">Saved Trees (A–Z)</div>
        <div class="sidebar-list" id="trees-list"></div>
    </div>

    <!-- Square Picture-in-Picture Minimap -->
    <div class="pip-minimap" id="pip-container">
        <svg id="minimap-svg"></svg>
    </div>

    <div class="zoom-indicator" id="zoom-indicator">Zoom: 100%</div>

    <!-- Node Editor Panel -->
    <div class="side-panel" id="side-panel">
        <div class="panel-header">
            <h2 id="panel-title-heading">Edit Node</h2>
            <button class="close-btn" id="btn-close-panel">&times;</button>
        </div>
        <div class="panel-body">
            <div class="input-group">
                <label>Node Type</label>
                <div class="type-selector-group">
                    <div class="type-radio-btn active" data-type="leaf">🍃 Leaf</div>
                    <div class="type-radio-btn" data-type="fruit" id="label-fruit-type">🍎 Fruit</div>
                    <div class="type-radio-btn" data-type="seed">🌱 Seed (Tree)</div>
                </div>
            </div>

            <div class="input-group">
                <label for="node-title-input">Node Title</label>
                <input type="text" id="node-title-input" placeholder="Title...">
            </div>

            <div class="input-group" id="fruit-options-group" style="display: none;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="fruit-ripe-toggle" style="width: 18px; height: 18px; accent-color: var(--fruit-ripe);">
                    <span id="label-ripe-text">Mark as Ripe / Completed</span>
                </label>
            </div>

            <div class="input-group" id="seed-options-group" style="display: none;">
                <label for="seed-linked-tree-select">Target Sub-Tree to Link</label>
                <select id="seed-linked-tree-select"></select>
            </div>

            <div class="input-group">
                <label for="node-desc-input">Notes & Parameters</label>
                <textarea id="node-desc-input" placeholder="Notes..."></textarea>
            </div>
        </div>
        <div class="panel-footer">
            <button class="btn-danger" id="btn-delete">Delete</button>
            <button id="btn-save">Save</button>
        </div>
    </div>

    <!-- Season & Harvest Console Panel -->
    <div class="side-panel" id="season-panel">
        <div class="panel-header">
            <h2 id="season-panel-title">Canopy Lifecycle & Seasons</h2>
            <button class="close-btn" id="btn-close-season">&times;</button>
        </div>
        <div class="panel-body">
            <div class="input-group">
                <label>Tree Archetype & Species</label>
                <select id="tree-species-select">
                    <option value="oak">🌳 Ancient Oak (Research & Deep Logic)</option>
                    <option value="evergreen">🌲 Evergreen Pine (Wiki & Permanent SOPs)</option>
                    <option value="orchard">🍎 Fruit Orchard (Sprints & Goal Execution)</option>
                    <option value="willow">🎋 Weeping Willow (Scratchpad & Brainstorms)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Current Season</label>
                <div class="type-selector-group">
                    <button class="type-radio-btn" data-season="spring">🌸 Spring</button>
                    <button class="type-radio-btn" data-season="summer">☀️ Summer</button>
                    <button class="type-radio-btn" data-season="fall">🍂 Fall</button>
                    <button class="type-radio-btn" data-season="winter">❄️ Winter</button>
                </div>
            </div>

            <div class="input-group">
                <label>Lifecycle Actions</label>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-harvest" id="btn-harvest-action" style="flex: 1;">🧺 Harvest Ripe</button>
                    <button class="btn-prune" id="btn-prune-action" style="flex: 1;">✂️ Prune Deadwood</button>
                </div>
            </div>

            <div class="input-group">
                <label id="harvest-basket-label">Harvest Basket (Archived Milestones)</label>
                <div id="harvest-basket-list" style="background:#0f172a; border:1px solid var(--node-border); border-radius:8px; padding:8px; max-height:160px; overflow-y:auto; font-size:12px;"></div>
            </div>
        </div>
        <div class="panel-footer">
            <button id="btn-apply-season" style="width:100%;">Apply Lifecycle Settings</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'sylva_data_v1';
        const LIBRARY_KEY = 'sylva_library_v1';

        const SPECIES_CONFIG = {
            oak: {
                name: 'Ancient Oak',
                icon: '🌳',
                fruitName: 'Acorn',
                fruitIcon: '🌰',
                ripeIcon: '✨🌰',
                desc: 'Deep Hierarchies & Research'
            },
            evergreen: {
                name: 'Evergreen Pine',
                icon: '🌲',
                fruitName: 'Pinecone',
                fruitIcon: '🪵',
                ripeIcon: '✨🪵',
                desc: 'Persistent Wiki & Core Reference'
            },
            orchard: {
                name: 'Fruit Orchard',
                icon: '🍎',
                fruitName: 'Apple',
                fruitIcon: '🍎',
                ripeIcon: '🍏',
                desc: 'Sprints & Actionable Projects'
            },
            willow: {
                name: 'Weeping Willow',
                icon: '🎋',
                fruitName: 'Shoot',
                fruitIcon: '🫐',
                ripeIcon: '✨🫐',
                desc: 'Flexible Scratchpad & Brainstorming'
            }
        };

        const SEASONS_CONFIG = {
            spring: { name: 'Spring', icon: '🌸', desc: 'Sprouting & Ideation' },
            summer: { name: 'Summer', icon: '☀️', desc: 'Execution & High Activity' },
            fall: { name: 'Fall', icon: '🍂', desc: 'Harvest & Retrospectives' },
            winter: { name: 'Winter', icon: '❄️', desc: 'Pruning & Dormancy' }
        };

        const defaultRegistry = {
            'root_tree': {
                id: 'root_tree',
                title: 'Core Architecture',
                species: 'oak',
                season: 'spring',
                x: -110,
                y: 80,
                zIndex: 2,
                harvestBasket: [],
                nodes: [
                    {
                        id: 'root',
                        title: 'Node 1',
                        description: 'Root system concept and foundational trunk.',
                        type: 'leaf',
                        x: 0,
                        y: 100,
                        parentId: null,
                        zIndex: 2
                    },
                    {
                        id: 'node-2',
                        title: 'Node 2',
                        description: 'Actionable milestone item.',
                        type: 'fruit',
                        isRipe: false,
                        x: -160,
                        y: 280,
                        parentId: 'root',
                        zIndex: 3
                    },
                    {
                        id: 'node-3',
                        title: 'Node 3',
                        description: 'Nested tree capsule leading to sub-canopy.',
                        type: 'seed',
                        childTreeId: 'sub_tree_node_3',
                        x: 160,
                        y: 280,
                        parentId: 'root',
                        zIndex: 4
                    }
                ]
            },
            'sub_tree_node_3': {
                id: 'sub_tree_node_3',
                title: 'Branch Pipeline',
                species: 'orchard',
                season: 'summer',
                x: 180,
                y: 80,
                zIndex: 3,
                harvestBasket: [],
                nodes: [
                    {
                        id: 'sub-root',
                        title: 'Pipeline Core',
                        description: 'Sprint planning and sprint deliverables.',
                        type: 'leaf',
                        x: 0,
                        y: 100,
                        parentId: null,
                        zIndex: 2
                    }
                ]
            }
        };

        let treeRegistry = defaultRegistry;
        let activeTreePath = ['root_tree'];
        let currentTreeId = 'root_tree';
        let nodes = [];
        let highestZIndex = 10;
        let isForestView = false;

        let selectedNodeId = null;
        let selectedTreePlotId = null;
        let scale = 1;
        let panX = window.innerWidth / 2 - 105;
        let panY = 80;

        let isPanning = false;
        let startPanX = 0, startPanY = 0;

        let isDraggingElement = false;
        let draggedElementId = null;
        let dragWorldOffsetX = 0, dragWorldOffsetY = 0;
        let holdTimer = null;
        let activeDragPointerId = null;

        let lastTapElementId = null;
        let lastTapTime = 0;

        let editingNodeType = 'leaf';

        // Multi-touch tracking
        let activeTouches = new Map();
        let initialPinchDistance = null;
        let initialPinchScale = 1;
        let pinchCenterWorldX = 0;
        let pinchCenterWorldY = 0;

        // Minimap Camera State (Square 1:1)
        let pipView = { x: 0, y: 0, w: 1000, h: 1000 };
        let isPipPanning = false;
        let pipStartPointerX = 0, pipStartPointerY = 0;
        let pipStartViewX = 0, pipStartViewY = 0;
        let pipLastClickTime = 0;
        let pipInitialPinchDist = null;
        let pipInitialW = 0, pipInitialH = 0;
        let pipPointerMoved = false;
        let pipSingleClickTimer = null;
        let pipIsDoubleTap = false;

        // DOM Elements
        const container = document.getElementById('canvas-container');
        const world = document.getElementById('world');
        const nodesLayer = document.getElementById('nodes-layer');
        const svgLayer = document.getElementById('connections');
        const pipContainer = document.getElementById('pip-container');
        const minimapSvg = document.getElementById('minimap-svg');
        const sidebar = document.getElementById('sidebar');
        const sidebarList = document.getElementById('sidebar-list');
        const treesSidebar = document.getElementById('trees-sidebar');
        const treesList = document.getElementById('trees-list');
        const sidePanel = document.getElementById('side-panel');
        const seasonPanel = document.getElementById('season-panel');
        const zoomIndicator = document.getElementById('zoom-indicator');
        const titleInput = document.getElementById('node-title-input');
        const descInput = document.getElementById('node-desc-input');
        const importFileInput = document.getElementById('import-file-input');
        const fruitOptionsGroup = document.getElementById('fruit-options-group');
        const fruitRipeToggle = document.getElementById('fruit-ripe-toggle');
        const seedOptionsGroup = document.getElementById('seed-options-group');
        const seedLinkedTreeSelect = document.getElementById('seed-linked-tree-select');
        const typeButtons = document.querySelectorAll('#side-panel .type-radio-btn');
        const seasonToggleBtn = document.getElementById('btn-season-toggle');
        const treeSpeciesSelect = document.getElementById('tree-species-select');
        const seasonButtons = document.querySelectorAll('#season-panel [data-season]');
        const harvestBasketList = document.getElementById('harvest-basket-list');
        const centerActionButton = document.getElementById('btn-center-action');

        function isEditorOpen() {
            return sidePanel.classList.contains('open') || seasonPanel.classList.contains('open');
        }

        function getActiveTree() {
            if (!treeRegistry[currentTreeId]) {
                currentTreeId = Object.keys(treeRegistry)[0] || 'root_tree';
            }
            return treeRegistry[currentTreeId];
        }

        function loadNodes() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.treeRegistry && parsed.currentTreeId && parsed.treeRegistry[parsed.currentTreeId]) {
                        treeRegistry = parsed.treeRegistry;
                        currentTreeId = parsed.currentTreeId;
                        activeTreePath = parsed.activeTreePath || [currentTreeId];
                        return treeRegistry[currentTreeId].nodes;
                    }
                }
            } catch (e) {}
            return treeRegistry['root_tree'].nodes;
        }

        function saveNodes() {
            try {
                if (!isForestView && treeRegistry[currentTreeId]) {
                    treeRegistry[currentTreeId].nodes = nodes;
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    treeRegistry: treeRegistry,
                    currentTreeId: currentTreeId,
                    activeTreePath: activeTreePath
                }));
            } catch (e) {
                console.error('Storage quota exceeded', e);
            }
        }

        function loadLibrary() {
            try {
                const lib = localStorage.getItem(LIBRARY_KEY);
                if (lib) return JSON.parse(lib);
            } catch (e) {}
            const initialLib = { 'Core Architecture.json': treeRegistry['root_tree'].nodes };
            saveLibrary(initialLib);
            return initialLib;
        }

        function saveLibrary(lib) {
            try {
                localStorage.setItem(LIBRARY_KEY, JSON.stringify(lib));
            } catch (e) {
                console.error('Library quota exceeded', e);
            }
        }

        function updateCenterButtonState() {
            if (isForestView) {
                centerActionButton.textContent = '🌱 Plant Tree';
                centerActionButton.classList.add('mode-forest');
            } else {
                centerActionButton.textContent = '+ Add Branch';
                centerActionButton.classList.remove('mode-forest');
            }
        }

        function applySeasonVisuals() {
            const tree = getActiveTree();
            const season = tree.season || 'spring';
            document.body.className = `season-${season}`;
            const sInfo = SEASONS_CONFIG[season] || SEASONS_CONFIG.spring;
            seasonToggleBtn.textContent = `${sInfo.icon} ${sInfo.name}`;
            seasonButtons.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-season') === season);
            });
        }

        function init() {
            nodes = loadNodes();
            nodes.forEach(n => {
                if (n.zIndex && n.zIndex > highestZIndex) highestZIndex = n.zIndex;
                if (!n.type) n.type = 'leaf';
            });

            applySeasonVisuals();
            updateCenterButtonState();
            render();
            updateTransform();
            resetMinimapCamera();
            renderSidebar();
            renderTreesList();
            renderBreadcrumbs();
            setupPointerEvents();
            setupPipEvents();
            setupEditorTypeEvents();
            setupSeasonPanelEvents();
            registerServiceWorker();
        }

        function render() {
            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            if (isForestView) {
                renderForestBotanicalTrees();
                return;
            }

            const activeTree = getActiveTree();
            const species = SPECIES_CONFIG[activeTree.species || 'oak'] || SPECIES_CONFIG.oak;

            nodes.forEach(node => {
                if (node.parentId) {
                    const parent = nodes.find(n => n.id === node.parentId);
                    if (parent) {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.id = `edge-${node.id}`;
                        path.setAttribute('d', calculatePath(parent, node));
                        path.setAttribute('stroke', '#64748b');
                        path.setAttribute('stroke-width', '2.5');
                        path.setAttribute('fill', 'none');
                        svgLayer.appendChild(path);
                    }
                }
            });

            nodes.forEach(node => {
                const el = document.createElement('div');
                const isSelected = (node.id === selectedNodeId);
                const nodeType = node.type || 'leaf';
                const isRipe = node.isRipe || false;

                el.className = `node type-${nodeType} ${isRipe ? 'ripe' : ''} ${isSelected ? 'selected' : ''}`;
                el.id = `dom-${node.id}`;
                el.style.transform = `translate(${node.x}px, ${node.y}px)`;
                el.style.zIndex = node.zIndex || 2;

                let headerRightHtml = '';
                if (nodeType === 'leaf') {
                    headerRightHtml = `<span class="node-badge badge-leaf">Leaf</span>`;
                } else if (nodeType === 'fruit') {
                    const fruitIcon = isRipe ? species.ripeIcon : species.fruitIcon;
                    headerRightHtml = `
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span class="node-badge badge-fruit ${isRipe ? 'ripe' : ''}">${fruitIcon} ${isRipe ? 'Ripe' : species.fruitName}</span>
                            <input type="checkbox" class="fruit-checkbox" ${isRipe ? 'checked' : ''} title="Mark Ripe">
                        </div>
                    `;
                } else if (nodeType === 'seed') {
                    headerRightHtml = `
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span class="node-badge badge-seed">Seed</span>
                            <button class="seed-open-btn" title="Open Nested Tree">Open ↗</button>
                        </div>
                    `;
                }

                el.innerHTML = `
                    <div class="node-header-row">
                        <div class="node-title">${escapeHTML(node.title)}</div>
                        ${headerRightHtml}
                    </div>
                    <div class="node-snippet">${escapeHTML(node.description)}</div>
                `;

                const fruitCb = el.querySelector('.fruit-checkbox');
                if (fruitCb) {
                    fruitCb.addEventListener('click', (e) => {
                        e.stopPropagation();
                        node.isRipe = fruitCb.checked;
                        saveNodes();
                        render();
                        updateMinimap();
                    });
                }

                const seedBtn = el.querySelector('.seed-open-btn');
                if (seedBtn) {
                    seedBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openNestedTree(node);
                    });
                }

                el.addEventListener('pointerdown', (e) => {
                    if (isEditorOpen() || activeTouches.size >= 2) return;
                    if (e.target.classList.contains('fruit-checkbox') || e.target.classList.contains('seed-open-btn')) return;

                    const now = Date.now();
                    if (lastTapElementId === node.id && (now - lastTapTime) < 320) {
                        clearTimeout(holdTimer);
                        selectNode(node.id, true);
                        lastTapTime = 0;
                        return;
                    }
                    lastTapElementId = node.id;
                    lastTapTime = now;

                    const isAlreadySelected = (selectedNodeId === node.id);

                    const startDrag = () => {
                        isPanning = false;
                        isDraggingElement = true;
                        draggedElementId = node.id;
                        activeDragPointerId = e.pointerId;
                        el.classList.add('dragging');

                        const worldPointerX = (e.clientX - panX) / scale;
                        const worldPointerY = (e.clientY - panY) / scale;
                        dragWorldOffsetX = worldPointerX - node.x;
                        dragWorldOffsetY = worldPointerY - node.y;
                    };

                    if (isAlreadySelected || e.pointerType === 'mouse') {
                        e.stopPropagation();
                        elevateNodeZIndex(node);
                        startDrag();
                    } else {
                        selectNode(node.id, false);

                        if (activeTouches.size === 1) {
                            isPanning = true;
                            startPanX = e.clientX - panX;
                            startPanY = e.clientY - panY;
                        }

                        clearTimeout(holdTimer);
                        holdTimer = setTimeout(() => {
                            if (activeTouches.has(e.pointerId) && activeTouches.size === 1) {
                                startDrag();
                                if (navigator.vibrate) navigator.vibrate(25);
                            }
                        }, 200);
                    }
                });

                nodesLayer.appendChild(el);
            });
        }

        // Procedural Vector Trees for Forest Overview (Swapped: Double-Tap opens Settings, Long-Press Enters Canopy)
        function renderForestBotanicalTrees() {
            const treeKeys = Object.keys(treeRegistry);

            treeKeys.forEach((tId, idx) => {
                const tree = treeRegistry[tId];
                const speciesKey = tree.species || 'oak';
                const seasonKey = tree.season || 'spring';
                const species = SPECIES_CONFIG[speciesKey] || SPECIES_CONFIG.oak;

                if (tree.x === undefined) tree.x = (idx * 300) - ((treeKeys.length * 300) / 2) + 40;
                if (tree.y === undefined) tree.y = 80;

                const plot = document.createElement('div');
                const isSelected = (selectedTreePlotId === tId);
                plot.className = `botanical-tree-plot ${isSelected ? 'selected' : ''}`;
                plot.id = `tree-plot-${tId}`;
                plot.style.transform = `translate(${tree.x}px, ${tree.y}px)`;
                plot.style.zIndex = tree.zIndex || 2;

                const nodeCount = tree.nodes.length;
                const ripeCount = tree.nodes.filter(n => n.type === 'fruit' && n.isRipe).length;
                const totalFruit = tree.nodes.filter(n => n.type === 'fruit').length;

                const treeSvg = generateBotanicalTreeSvg(speciesKey, seasonKey, nodeCount, ripeCount);

                plot.innerHTML = `
                    ${treeSvg}
                    <div class="botanical-tree-card">
                        <div class="botanical-tree-title">${species.icon} ${escapeHTML(tree.title)}</div>
                        <div class="botanical-tree-stats">
                            <span>🌿 ${nodeCount}</span>
                            <span>${species.fruitIcon} ${ripeCount}/${totalFruit}</span>
                            <span>${SEASONS_CONFIG[seasonKey]?.icon || '🌸'}</span>
                        </div>
                    </div>
                `;

                plot.addEventListener('pointerdown', (e) => {
                    if (isEditorOpen() || activeTouches.size >= 2) return;

                    const now = Date.now();

                    // Double-tap opens Canopy Lifecycle and Seasons Drawer
                    if (lastTapElementId === tId && (now - lastTapTime) < 320) {
                        clearTimeout(holdTimer);
                        openSeasonPanel(tId);
                        lastTapTime = 0;
                        return;
                    }
                    lastTapElementId = tId;
                    lastTapTime = now;

                    const isAlreadySelected = (selectedTreePlotId === tId);
                    selectTreePlot(tId);

                    const startDragTree = () => {
                        isPanning = false;
                        isDraggingElement = true;
                        draggedElementId = tId;
                        activeDragPointerId = e.pointerId;
                        plot.classList.add('dragging');

                        const worldPointerX = (e.clientX - panX) / scale;
                        const worldPointerY = (e.clientY - panY) / scale;
                        dragWorldOffsetX = worldPointerX - tree.x;
                        dragWorldOffsetY = worldPointerY - tree.y;
                    };

                    if (isAlreadySelected || e.pointerType === 'mouse') {
                        e.stopPropagation();
                        elevateTreePlotZIndex(tree);
                        startDragTree();
                    } else {
                        if (activeTouches.size === 1) {
                            isPanning = true;
                            startPanX = e.clientX - panX;
                            startPanY = e.clientY - panY;
                        }
                    }

                    // Long-press (500ms) vibrates device and enters the tree canopy
                    clearTimeout(holdTimer);
                    holdTimer = setTimeout(() => {
                        if (activeTouches.has(e.pointerId) && !isDraggingElement) {
                            if (navigator.vibrate) navigator.vibrate(40);
                            enterTreeCanopy(tId);
                        }
                    }, 500);
                });

                nodesLayer.appendChild(plot);
            });
        }

        function selectTreePlot(treeId) {
            selectedTreePlotId = treeId;
            document.querySelectorAll('.botanical-tree-plot').forEach(el => {
                el.classList.toggle('selected', el.id === `tree-plot-${treeId}`);
            });
            updateMinimap();
        }

        function elevateTreePlotZIndex(tree) {
            highestZIndex += 1;
            tree.zIndex = highestZIndex;
            const domEl = document.getElementById(`tree-plot-${tree.id}`);
            if (domEl) domEl.style.zIndex = tree.zIndex;
        }

        function generateBotanicalTreeSvg(species, season, nodeCount, ripeCount) {
            let cTop = '#4ade80', cBot = '#15803d';
            if (season === 'summer') { cTop = '#22c55e'; cBot = '#065f46'; }
            else if (season === 'fall') { cTop = '#f59e0b'; cBot = '#9a3412'; }
            else if (season === 'winter') { cTop = '#94a3b8'; cBot = '#334155'; }

            const growth = Math.min(Math.max(nodeCount / 10, 0.75), 1.35);

            let foliagePath = '';
            let trunkPath = '';

            if (species === 'oak') {
                trunkPath = `M 88 200 C 88 150, 78 130, 68 115 C 80 120, 108 120, 120 115 C 110 130, 102 150, 102 200 Z`;
                foliagePath = `
                    M 95 30 
                    C 60 25, 30 55, 38 85 
                    C 15 100, 20 135, 48 145 
                    C 60 160, 130 160, 142 145 
                    C 170 135, 175 100, 152 85 
                    C 160 55, 130 25, 95 30 Z
                `;
            } else if (species === 'evergreen') {
                trunkPath = `M 92 200 L 92 120 L 98 120 L 98 200 Z`;
                foliagePath = `
                    M 95 20 
                    L 115 55 L 105 55 L 125 90 L 112 90 L 135 130 L 55 130 L 78 90 L 65 90 L 85 55 L 75 55 Z
                `;
            } else if (species === 'orchard') {
                trunkPath = `M 89 200 C 89 155, 82 140, 75 125 C 90 128, 100 128, 115 125 C 108 140, 101 155, 101 200 Z`;
                foliagePath = `
                    M 95 35 
                    C 65 35, 42 60, 48 90 
                    C 28 105, 35 140, 62 145 
                    C 80 155, 110 155, 128 145 
                    C 155 140, 162 105, 142 90 
                    C 148 60, 125 35, 95 35 Z
                `;
            } else {
                trunkPath = `M 86 200 C 86 160, 92 140, 105 110 C 95 125, 90 150, 96 200 Z`;
                foliagePath = `
                    M 95 25 
                    C 50 30, 25 75, 28 135 
                    C 45 155, 65 110, 85 95 
                    C 105 110, 125 155, 162 135 
                    C 165 75, 140 30, 95 25 Z
                `;
            }

            let fruitDots = '';
            const fruitSpots = [
                { x: 75, y: 70 }, { x: 115, y: 65 }, { x: 60, y: 105 },
                { x: 130, y: 100 }, { x: 95, y: 115 }, { x: 95, y: 50 }
            ];

            const renderFruitsCount = Math.min(ripeCount, fruitSpots.length);
            for (let i = 0; i < renderFruitsCount; i++) {
                const pt = fruitSpots[i];
                fruitDots += `<circle cx="${pt.x}" cy="${pt.y}" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" filter="drop-shadow(0 0 4px #10b981)"/>`;
            }

            const uniqueGradId = `tree-grad-${Math.random().toString(36).substr(2, 6)}`;

            return `
                <svg class="botanical-tree-svg" viewBox="0 0 190 220" style="transform: scale(${growth}); transform-origin: 50% 90%;">
                    <defs>
                        <linearGradient id="${uniqueGradId}" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="${cTop}"/>
                            <stop offset="100%" stop-color="${cBot}"/>
                        </linearGradient>
                    </defs>
                    <ellipse cx="95" cy="202" rx="42" ry="7" fill="rgba(0,0,0,0.5)" filter="blur(2px)"/>
                    <path d="${trunkPath}" fill="#78350f" stroke="#451a03" stroke-width="2"/>
                    <path d="${foliagePath}" fill="url(#${uniqueGradId})" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                    ${fruitDots}
                </svg>
            `;
        }

        function enterTreeCanopy(treeId) {
            isForestView = false;
            currentTreeId = treeId;
            activeTreePath = [treeId];
            nodes = treeRegistry[treeId].nodes;
            selectedNodeId = null;
            selectedTreePlotId = null;

            applySeasonVisuals();
            updateCenterButtonState();
            saveNodes();
            render();
            renderSidebar();
            renderBreadcrumbs();
            resetMinimapCamera();
            autoTidyTopDown();
        }

        function enterForestView() {
            isForestView = true;
            selectedNodeId = null;
            selectedTreePlotId = null;
            document.body.className = 'season-spring';
            seasonToggleBtn.textContent = '🌲 Forest';

            updateCenterButtonState();
            render();
            renderBreadcrumbs();
            renderSidebar();
            resetMinimapCamera();

            panX = window.innerWidth / 2;
            panY = 120;
            scale = 0.85;
            updateTransform();
        }

        function promptPlantNewTree() {
            const treeNameInput = prompt('Enter a name for the new tree:', 'New_Canopy');
            if (!treeNameInput) return;

            const finalName = treeNameInput.endsWith('.json') ? treeNameInput : `${treeNameInput}.json`;
            const newTreeId = 'tree_' + Date.now();

            const freshTreeNodes = [
                {
                    id: 'root',
                    title: 'Node 1',
                    description: 'Root system concept and foundational trunk.',
                    type: 'leaf',
                    x: 0,
                    y: 100,
                    parentId: null,
                    zIndex: 2
                }
            ];

            const existingPlots = Object.keys(treeRegistry).length;

            treeRegistry[newTreeId] = {
                id: newTreeId,
                title: treeNameInput.replace('.json', ''),
                species: 'oak',
                season: 'spring',
                x: (existingPlots * 300) - 150,
                y: 80,
                zIndex: 2,
                harvestBasket: [],
                nodes: freshTreeNodes
            };

            const lib = loadLibrary();
            lib[finalName] = freshTreeNodes;
            saveLibrary(lib);

            currentTreeId = newTreeId;
            activeTreePath = [newTreeId];
            nodes = freshTreeNodes;
            selectedNodeId = null;
            highestZIndex = 10;
            saveNodes();

            isForestView = false;
            applySeasonVisuals();
            updateCenterButtonState();
            render();
            renderSidebar();
            renderTreesList();
            renderBreadcrumbs();
            resetMinimapCamera();
            autoTidyTopDown();
            treesSidebar.classList.remove('open');
        }

        function renderBreadcrumbs() {
            const trail = document.getElementById('breadcrumb-trail');
            const upBtn = document.getElementById('btn-tree-up');
            trail.innerHTML = '';

            const forestCrumb = document.createElement('span');
            forestCrumb.className = `breadcrumb-crumb ${isForestView ? 'active' : ''}`;
            forestCrumb.textContent = '🌲 Forest';
            forestCrumb.addEventListener('click', enterForestView);
            trail.appendChild(forestCrumb);

            if (isForestView) {
                upBtn.style.display = 'none';
                return;
            }

            const sepInitial = document.createElement('span');
            sepInitial.className = 'breadcrumb-separator';
            sepInitial.textContent = '>';
            trail.appendChild(sepInitial);

            upBtn.style.display = 'flex';

            activeTreePath.forEach((treeId, index) => {
                const tree = treeRegistry[treeId];
                if (!tree) return;

                const crumb = document.createElement('span');
                crumb.className = `breadcrumb-crumb ${index === activeTreePath.length - 1 ? 'active' : ''}`;
                crumb.textContent = tree.title || 'Untitled Tree';

                crumb.addEventListener('click', () => {
                    navigateToCrumbIndex(index);
                });

                trail.appendChild(crumb);

                if (index < activeTreePath.length - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'breadcrumb-separator';
                    sep.textContent = '>';
                    trail.appendChild(sep);
                }
            });
        }

        function navigateToCrumbIndex(targetIndex) {
            isForestView = false;
            treeRegistry[currentTreeId].nodes = JSON.parse(JSON.stringify(nodes));
            activeTreePath = activeTreePath.slice(0, targetIndex + 1);
            currentTreeId = activeTreePath[activeTreePath.length - 1];
            loadActiveTree();
        }

        function navigateUpOneLevel() {
            if (activeTreePath.length > 1) {
                navigateToCrumbIndex(activeTreePath.length - 2);
            } else {
                enterForestView();
            }
        }

        function loadActiveTree() {
            isForestView = false;
            nodes = treeRegistry[currentTreeId].nodes;
            selectedNodeId = null;
            selectedTreePlotId = null;

            applySeasonVisuals();
            updateCenterButtonState();
            saveNodes();
            render();
            renderSidebar();
            renderBreadcrumbs();
            resetMinimapCamera();
            autoTidyTopDown();
        }

        function openNestedTree(node) {
            if (!node.childTreeId || !treeRegistry[node.childTreeId]) {
                const newTreeId = 'tree_' + node.id;
                node.childTreeId = newTreeId;
                
                const activeTree = getActiveTree();
                treeRegistry[newTreeId] = {
                    id: newTreeId,
                    title: node.title,
                    species: activeTree.species || 'orchard',
                    season: activeTree.season || 'spring',
                    x: 0,
                    y: 80,
                    zIndex: 2,
                    harvestBasket: [],
                    nodes: [
                        {
                            id: 'root_' + Date.now(),
                            title: `${node.title} Core`,
                            description: `Drill-down workspace for ${node.title}.`,
                            type: 'leaf',
                            x: 0,
                            y: 100,
                            parentId: null,
                            zIndex: 2
                        }
                    ]
                };
            }

            treeRegistry[currentTreeId].nodes = JSON.parse(JSON.stringify(nodes));
            activeTreePath.push(node.childTreeId);
            currentTreeId = node.childTreeId;
            loadActiveTree();
        }

        function elevateNodeZIndex(node) {
            highestZIndex += 1;
            node.zIndex = highestZIndex;
            const domEl = document.getElementById(`dom-${node.id}`);
            if (domEl) domEl.style.zIndex = node.zIndex;
        }

        function calculatePath(parent, node) {
            const sX = parent.x + 107;
            const sY = parent.y + 68;
            const eX = node.x + 107;
            const eY = node.y;
            const midY = (sY + eY) / 2;
            return `M ${sX} ${sY} C ${sX} ${midY}, ${eX} ${midY}, ${eX} ${eY}`;
        }

        function updateNodeVisuals(node) {
            const el = document.getElementById(`dom-${node.id}`);
            if (el) {
                el.style.transform = `translate(${node.x}px, ${node.y}px)`;
                el.style.zIndex = node.zIndex || 2;
            }

            if (node.parentId) {
                const parent = nodes.find(n => n.id === node.parentId);
                const inEdge = document.getElementById(`edge-${node.id}`);
                if (inEdge && parent) {
                    inEdge.setAttribute('d', calculatePath(parent, node));
                }
            }

            nodes.filter(n => n.parentId === node.id).forEach(child => {
                const outEdge = document.getElementById(`edge-${child.id}`);
                if (outEdge) {
                    outEdge.setAttribute('d', calculatePath(node, child));
                }
            });
        }

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }

        function selectNode(id, openEditor = false) {
            selectedNodeId = id;
            document.querySelectorAll('.node').forEach(el => {
                el.classList.toggle('selected', el.id === `dom-${id}`);
            });

            if (id) {
                const node = nodes.find(n => n.id === id);
                if (node) elevateNodeZIndex(node);
            }

            if (openEditor) {
                const node = nodes.find(n => n.id === id);
                if (node) {
                    titleInput.value = node.title;
                    descInput.value = node.description;
                    setEditorNodeType(node.type || 'leaf');
                    fruitRipeToggle.checked = node.isRipe || false;
                    populateSeedTreeDropdown(node.childTreeId);

                    const activeTree = getActiveTree();
                    const species = SPECIES_CONFIG[activeTree.species || 'oak'] || SPECIES_CONFIG.oak;
                    document.getElementById('label-fruit-type').textContent = `${species.fruitIcon} ${species.fruitName}`;
                    document.getElementById('label-ripe-text').textContent = `Mark ${species.fruitName} as Ripe / Harvested`;

                    sidePanel.classList.add('open');
                }
            }

            renderSidebar();
            updateMinimap();
        }

        function deselectAll() {
            if (isForestView) {
                if (selectedTreePlotId) {
                    selectedTreePlotId = null;
                    document.querySelectorAll('.botanical-tree-plot').forEach(p => p.classList.remove('selected'));
                    updateMinimap();
                }
                return;
            }

            if (selectedNodeId && !isEditorOpen()) {
                selectedNodeId = null;
                document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
                updateMinimap();
                renderSidebar();
            }
        }

        function focusNodeAsHeader(node) {
            const targetScale = 1.65;
            scale = targetScale;
            panX = (window.innerWidth / 2) - ((node.x + 107) * scale);
            panY = 160 - (node.y * scale);
            
            updateTransform();
            zoomIndicator.innerText = `Zoom: ${Math.round(scale * 100)}%`;
        }

        function centerOnNode(node) {
            panX = (window.innerWidth / 2) - ((node.x + 107) * scale);
            panY = (window.innerHeight / 2) - ((node.y + 35) * scale);
            updateTransform();
        }

        function setupEditorTypeEvents() {
            typeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setEditorNodeType(btn.getAttribute('data-type'));
                });
            });
        }

        function setEditorNodeType(type) {
            editingNodeType = type;
            typeButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-type') === type));
            fruitOptionsGroup.style.display = (type === 'fruit') ? 'flex' : 'none';
            seedOptionsGroup.style.display = (type === 'seed') ? 'flex' : 'none';
        }

        function populateSeedTreeDropdown(selectedTreeId) {
            seedLinkedTreeSelect.innerHTML = '<option value="">-- Auto-Generated Sub-Tree --</option>';
            Object.keys(treeRegistry).forEach(k => {
                if (k !== currentTreeId) {
                    const opt = document.createElement('option');
                    opt.value = k;
                    opt.textContent = treeRegistry[k].title || k;
                    if (k === selectedTreeId) opt.selected = true;
                    seedLinkedTreeSelect.appendChild(opt);
                }
            });
        }

        let activeTargetTreeId = null;

        function setupSeasonPanelEvents() {
            seasonToggleBtn.addEventListener('click', () => {
                openSeasonPanel();
            });

            document.getElementById('btn-close-season').addEventListener('click', () => {
                seasonPanel.classList.remove('open');
            });

            seasonButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    seasonButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });

            document.getElementById('btn-apply-season').addEventListener('click', () => {
                const targetId = activeTargetTreeId || currentTreeId;
                const targetTree = treeRegistry[targetId];
                if (targetTree) {
                    targetTree.species = treeSpeciesSelect.value;
                    const activeSeasonBtn = document.querySelector('#season-panel [data-season].active');
                    if (activeSeasonBtn) {
                        targetTree.season = activeSeasonBtn.getAttribute('data-season');
                    }
                    saveNodes();
                    if (!isForestView && targetId === currentTreeId) {
                        applySeasonVisuals();
                    }
                    render();
                    renderSidebar();
                }
                seasonPanel.classList.remove('open');
            });

            document.getElementById('btn-harvest-action').addEventListener('click', () => {
                const targetId = activeTargetTreeId || currentTreeId;
                const targetTree = treeRegistry[targetId];
                if (!targetTree.harvestBasket) targetTree.harvestBasket = [];

                const treeNodeList = isForestView ? targetTree.nodes : nodes;
                const ripeNodes = treeNodeList.filter(n => n.type === 'fruit' && n.isRipe);
                if (ripeNodes.length === 0) {
                    alert('No ripe fruits ready for harvest on this canopy.');
                    return;
                }

                if (confirm(`Harvest ${ripeNodes.length} ripe fruit(s) into your Harvest Basket?`)) {
                    ripeNodes.forEach(rn => {
                        targetTree.harvestBasket.push({
                            id: rn.id,
                            title: rn.title,
                            description: rn.description,
                            harvestedAt: new Date().toLocaleDateString()
                        });
                    });

                    const ripeIds = new Set(ripeNodes.map(n => n.id));
                    targetTree.nodes = treeNodeList.filter(n => !ripeIds.has(n.id));
                    if (!isForestView && targetId === currentTreeId) {
                        nodes = targetTree.nodes;
                    }
                    saveNodes();
                    render();
                    renderSidebar();
                    populateHarvestBasketList(targetId);
                    updateMinimap();
                }
            });

            document.getElementById('btn-prune-action').addEventListener('click', () => {
                const targetId = activeTargetTreeId || currentTreeId;
                const targetTree = treeRegistry[targetId];
                const treeNodeList = isForestView ? targetTree.nodes : nodes;

                const deadLeaves = treeNodeList.filter(n => n.type === 'leaf' && n.id !== 'root' && !n.description && !treeNodeList.some(child => child.parentId === n.id));
                if (deadLeaves.length === 0) {
                    alert('No deadwood found. Canopy is clean and active.');
                    return;
                }

                if (confirm(`Prune ${deadLeaves.length} dead leaf node(s) without notes or children?`)) {
                    const deadIds = new Set(deadLeaves.map(n => n.id));
                    targetTree.nodes = treeNodeList.filter(n => !deadIds.has(n.id));
                    if (!isForestView && targetId === currentTreeId) {
                        nodes = targetTree.nodes;
                    }
                    saveNodes();
                    render();
                    renderSidebar();
                    updateMinimap();
                }
            });
        }

        function openSeasonPanel(treeId = null) {
            activeTargetTreeId = treeId || currentTreeId;
            const targetTree = treeRegistry[activeTargetTreeId];
            if (!targetTree) return;

            document.getElementById('season-panel-title').textContent = `${targetTree.title} Lifecycle`;
            treeSpeciesSelect.value = targetTree.species || 'oak';

            seasonButtons.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-season') === (targetTree.season || 'spring'));
            });

            populateHarvestBasketList(activeTargetTreeId);
            seasonPanel.classList.add('open');
        }

        function populateHarvestBasketList(treeId) {
            const targetTree = treeRegistry[treeId || currentTreeId];
            const basket = targetTree?.harvestBasket || [];
            harvestBasketList.innerHTML = '';

            if (basket.length === 0) {
                harvestBasketList.innerHTML = '<div style="color:var(--text-secondary); padding:4px;">No harvested fruits yet. Mark fruits as ripe and click "Harvest Ripe".</div>';
                return;
            }

            basket.slice().reverse().forEach(item => {
                const row = document.createElement('div');
                row.style.padding = '4px 0';
                row.style.borderBottom = '1px solid #1e293b';
                row.innerHTML = `<span style="color:var(--fruit-ripe); font-weight:600;">✓ ${escapeHTML(item.title)}</span> <span style="color:var(--text-secondary); font-size:10px;">(${item.harvestedAt})</span>`;
                harvestBasketList.appendChild(row);
            });
        }

        function setupPointerEvents() {
            document.getElementById('btn-tree-up').addEventListener('click', navigateUpOneLevel);

            centerActionButton.addEventListener('click', () => {
                if (isForestView) {
                    promptPlantNewTree();
                } else {
                    const parentId = selectedNodeId || nodes[0]?.id || null;
                    const parent = nodes.find(n => n.id === parentId);
                    const newNodeId = 'node-' + Date.now();
                    highestZIndex += 1;
                    nodes.push({
                        id: newNodeId,
                        title: `Node ${nodes.length + 1}`,
                        description: 'Branch details & notes...',
                        type: 'leaf',
                        x: parent ? parent.x + (Math.random() * 60 - 30) : 0,
                        y: parent ? parent.y + 150 : 100,
                        parentId: parentId,
                        zIndex: highestZIndex
                    });
                    saveNodes();
                    render();
                    renderSidebar();
                    selectNode(newNodeId, true);
                    updateMinimap();
                }
            });

            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#pip-container') || e.target.closest('#side-panel') || e.target.closest('#season-panel') || e.target.closest('.toolbar') || e.target.closest('#breadcrumb-bar') || e.target.closest('#sidebar') || e.target.closest('#trees-sidebar')) {
                    return;
                }

                activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activeTouches.size === 2) {
                    clearTimeout(holdTimer);
                    isPanning = false;
                    isDraggingElement = false;
                    draggedElementId = null;
                    document.querySelectorAll('.node, .botanical-tree-plot').forEach(el => el.classList.remove('dragging'));

                    const [t1, t2] = Array.from(activeTouches.values());
                    initialPinchDistance = Math.hypot(t2.x - t1.x, t2.y - t1.y) || 1;
                    initialPinchScale = scale;

                    const midScreenX = (t1.x + t2.x) / 2;
                    const midScreenY = (t1.y + t2.y) / 2;

                    pinchCenterWorldX = (midScreenX - panX) / scale;
                    pinchCenterWorldY = (midScreenY - panY) / scale;
                } else if (activeTouches.size === 1) {
                    const isOverElement = !!e.target.closest('.node') || !!e.target.closest('.botanical-tree-plot');
                    if (!isOverElement) {
                        deselectAll();
                        isPanning = true;
                        startPanX = e.clientX - panX;
                        startPanY = e.clientY - panY;
                    }
                }
            }, { capture: true });

            window.addEventListener('pointermove', (e) => {
                if (activeTouches.has(e.pointerId)) {
                    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                }

                if (holdTimer && !isDraggingElement) {
                    const tracked = activeTouches.get(e.pointerId);
                    if (tracked && Math.hypot(e.clientX - tracked.x, e.clientY - tracked.y) > 8) {
                        clearTimeout(holdTimer);
                    }
                }

                if (activeTouches.size === 2) {
                    const [t1, t2] = Array.from(activeTouches.values());
                    const currentDist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
                    const currentMidX = (t1.x + t2.x) / 2;
                    const currentMidY = (t1.y + t2.y) / 2;

                    if (!initialPinchDistance) {
                        initialPinchDistance = currentDist || 1;
                        initialPinchScale = scale;
                        pinchCenterWorldX = (currentMidX - panX) / scale;
                        pinchCenterWorldY = (currentMidY - panY) / scale;
                    }

                    const targetScale = Math.min(Math.max(initialPinchScale * (currentDist / initialPinchDistance), 0.3), 3.0);

                    scale = targetScale;
                    panX = currentMidX - pinchCenterWorldX * scale;
                    panY = currentMidY - pinchCenterWorldY * scale;

                    updateTransform();
                    zoomIndicator.innerText = `Zoom: ${Math.round(scale * 100)}%`;
                    return;
                }

                // Dragging in Forest View
                if (isForestView && isDraggingElement && draggedElementId && !isEditorOpen()) {
                    const tree = treeRegistry[draggedElementId];
                    if (tree) {
                        const worldPointerX = (e.clientX - panX) / scale;
                        const worldPointerY = (e.clientY - panY) / scale;
                        tree.x = worldPointerX - dragWorldOffsetX;
                        tree.y = worldPointerY - dragWorldOffsetY;
                        
                        const domEl = document.getElementById(`tree-plot-${draggedElementId}`);
                        if (domEl) domEl.style.transform = `translate(${tree.x}px, ${tree.y}px)`;
                        updateMinimap();
                    }
                    return;
                }

                // Dragging in Tree View
                if (!isForestView && isDraggingElement && draggedElementId && !isEditorOpen()) {
                    const node = nodes.find(n => n.id === draggedElementId);
                    if (node) {
                        const worldPointerX = (e.clientX - panX) / scale;
                        const worldPointerY = (e.clientY - panY) / scale;
                        node.x = worldPointerX - dragWorldOffsetX;
                        node.y = worldPointerY - dragWorldOffsetY;
                        updateNodeVisuals(node);
                        updateMinimap();
                    }
                    return;
                }

                if (isPanning && activeTouches.size === 1 && !isEditorOpen()) {
                    panX = e.clientX - startPanX;
                    panY = e.clientY - startPanY;
                    updateTransform();
                }
            });

            const onPointerEnd = (e) => {
                clearTimeout(holdTimer);
                activeTouches.delete(e.pointerId);

                if (isDraggingElement && activeDragPointerId === e.pointerId) {
                    saveNodes();
                    isDraggingElement = false;
                    draggedElementId = null;
                    activeDragPointerId = null;
                    document.querySelectorAll('.node, .botanical-tree-plot').forEach(el => el.classList.remove('dragging'));
                }

                if (activeTouches.size < 2) initialPinchDistance = null;
                if (activeTouches.size === 1) {
                    const remaining = Array.from(activeTouches.values())[0];
                    isPanning = true;
                    startPanX = remaining.x - panX;
                    startPanY = remaining.y - panY;
                } else if (activeTouches.size === 0) {
                    isPanning = false;
                }
            };

            window.addEventListener('pointerup', onPointerEnd);
