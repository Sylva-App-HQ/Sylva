name: Deploy Sylva with Dynamic Build Version

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stamp Build Version into Service Worker
        run: |
          BUILD_TAG="v0.3.1-b${{ github.run_number }}-${{ github.sha }}"
          sed -i "s/__BUILD_VERSION__/${BUILD_TAG}/g" sw.js
          echo "Stamped sw.js with ${BUILD_TAG}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4