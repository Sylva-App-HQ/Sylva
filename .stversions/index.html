<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Node Tree & Idea Manager</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.88);
            --panel-border: rgba(51, 65, 85, 0.65);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --node-bg: #1e293b;
            --node-border: #475569;
            --node-selected: #38bdf8;
            --line-color: #64748b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-primary);
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Unified World Plane */
        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            will-change: transform;
        }

        svg#connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        #nodes-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Top Bar */
        .toolbar {
            position: absolute;
            top: env(safe-area-inset-top, 14px);
            left: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            overflow-x: auto;
            touch-action: pan-x;
        }

        button {
            background: #334155;
            color: var(--text-primary);
            border: 1px solid var(--node-border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        button:active {
            background: var(--accent);
            color: #0f172a;
        }

        /* Node Elements */
        .node {
            position: absolute;
            z-index: 2;
            background: var(--node-bg);
            border: 2px solid var(--node-border);
            border-radius: 12px;
            padding: 12px 14px;
            width: 200px;
            cursor: grab;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s, box-shadow 0.2s;
            will-change: transform;
            pointer-events: auto;
        }

        .node.selected {
            border-color: var(--node-selected);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .node.dragging {
            cursor: grabbing;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            z-index: 10;
        }

        .node-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .node-snippet {
            font-size: 11px;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            pointer-events: none;
        }

        /* Alphabetical Sidebar */
        .sidebar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 280px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--panel-border);
            z-index: 30;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            touch-action: pan-y;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: calc(env(safe-area-inset-top, 14px) + 12px) 16px 14px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            touch-action: pan-y;
        }

        .sidebar-item {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        .sidebar-item:active, .sidebar-item.selected {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
        }

        .sidebar-item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-item-desc {
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Square Picture-in-Picture Minimap Window */
        .pip-minimap {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 14px) + 12px);
            left: 14px;
            width: 140px;
            height: 140px;
            aspect-ratio: 1 / 1;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1.5px solid var(--panel-border);
            border-radius: 14px;
            z-index: 15;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            cursor: pointer;
            touch-action: none;
        }

        .pip-minimap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .zoom-indicator {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 14px) + 12px);
            right: 14px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            z-index: 10;
            pointer-events: none;
        }

        /* Node Edit Bottom Sheet */
        .side-panel {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 80vh;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border-top: 1px solid var(--panel-border);
            border-radius: 20px 20px 0 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            touch-action: pan-y;
        }

        .side-panel.open {
            transform: translateY(0);
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            padding: 4px 8px;
        }

        .panel-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            touch-action: pan-y;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-group input, .input-group textarea {
            background: #0f172a;
            border: 1px solid var(--node-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            touch-action: auto;
        }

        .input-group textarea {
            resize: none;
            min-height: 100px;
        }

        .panel-footer {
            padding: 14px 20px calc(env(safe-area-inset-bottom, 14px) + 10px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-danger {
            background: #7f1d1d;
            border-color: #991b1b;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="world">
            <svg id="connections"></svg>
            <div id="nodes-layer"></div>
        </div>
    </div>

    <!-- Top Action Toolbar -->
    <div class="toolbar">
        <button id="btn-toggle-sidebar">☰ Nodes</button>
        <button id="btn-add">+ Child</button>
        <button id="btn-auto-tidy">Auto-Tidy</button>
        <button id="btn-import">Import</button>
        <button id="btn-export">Export</button>
        <input type="file" id="import-file-input" accept=".json" style="display: none;">
    </div>

    <!-- Alphabetical Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Node Index (A–Z)</h3>
            <button class="close-btn" id="btn-close-sidebar">&times;</button>
        </div>
        <div class="sidebar-list" id="sidebar-list"></div>
    </div>

    <!-- Square Interactive Picture-in-Picture Minimap -->
    <div class="pip-minimap" id="pip-container">
        <svg id="minimap-svg"></svg>
    </div>

    <div class="zoom-indicator" id="zoom-indicator">Zoom: 100%</div>

    <!-- Node Editor Panel -->
    <div class="side-panel" id="side-panel">
        <div class="panel-header">
            <h2 id="panel-title-heading">Edit Node</h2>
            <button class="close-btn" id="btn-close-panel">&times;</button>
        </div>
        <div class="panel-body">
            <div class="input-group">
                <label for="node-title-input">Node Title</label>
                <input type="text" id="node-title-input" placeholder="Title...">
            </div>
            <div class="input-group">
                <label for="node-desc-input">Notes & Parameters</label>
                <textarea id="node-desc-input" placeholder="Notes..."></textarea>
            </div>
        </div>
        <div class="panel-footer">
            <button class="btn-danger" id="btn-delete">Delete</button>
            <button id="btn-save">Save</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'nodetree_data_v1';

        const defaultNodes = [
            {
                id: 'root',
                title: 'Core Architecture',
                description: 'Foundational framework examining system boundaries and execution constraints.',
                x: 0,
                y: 100,
                parentId: null
            },
            {
                id: 'node-1',
                title: 'Consciousness & Code',
                description: 'Analyzing microjoule biological models vs silicon probability matrices.',
                x: -160,
                y: 280,
                parentId: 'root'
            },
            {
                id: 'node-2',
                title: 'Deterministic State',
                description: 'Structural bounds of transformer attention architectures.',
                x: 160,
                y: 280,
                parentId: 'root'
            }
        ];

        let nodes = loadNodes();

        let selectedNodeId = null;
        let scale = 1;
        let panX = window.innerWidth / 2 - 100;
        let panY = 60;

        let isPanning = false;
        let startPanX = 0, startPanY = 0;

        let isDraggingNode = false;
        let draggedNodeId = null;
        let dragWorldOffsetX = 0, dragWorldOffsetY = 0;
        let nodeHoldTimer = null;
        let activeDragPointerId = null;

        let lastTapNodeId = null;
        let lastTapTime = 0;

        // Unified Multi-Touch Tracking
        let activeTouches = new Map();
        let initialPinchDistance = null;
        let initialPinchScale = 1;
        let pinchCenterWorldX = 0;
        let pinchCenterWorldY = 0;

        // Minimap Camera State (Square 1:1)
        let pipView = { x: 0, y: 0, w: 1000, h: 1000 };
        let isPipPanning = false;
        let pipStartPointerX = 0, pipStartPointerY = 0;
        let pipStartViewX = 0, pipStartViewY = 0;
        let pipLastClickTime = 0;
        let pipInitialPinchDist = null;
        let pipInitialW = 0, pipInitialH = 0;
        let pipPointerMoved = false;
        let pipSingleClickTimer = null;
        let pipIsDoubleTap = false;

        // DOM Elements
        const container = document.getElementById('canvas-container');
        const world = document.getElementById('world');
        const nodesLayer = document.getElementById('nodes-layer');
        const svgLayer = document.getElementById('connections');
        const pipContainer = document.getElementById('pip-container');
        const minimapSvg = document.getElementById('minimap-svg');
        const sidebar = document.getElementById('sidebar');
        const sidebarList = document.getElementById('sidebar-list');
        const sidePanel = document.getElementById('side-panel');
        const zoomIndicator = document.getElementById('zoom-indicator');
        const titleInput = document.getElementById('node-title-input');
        const descInput = document.getElementById('node-desc-input');
        const importFileInput = document.getElementById('import-file-input');

        function isEditorOpen() {
            return sidePanel.classList.contains('open');
        }

        function loadNodes() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : defaultNodes;
            } catch (e) {
                return defaultNodes;
            }
        }

        function saveNodes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(nodes));
            } catch (e) {
                console.error('Storage quota exceeded', e);
            }
        }

        function init() {
            render();
            updateTransform();
            resetMinimapCamera();
            renderSidebar();
            setupPointerEvents();
            setupPipEvents();
            registerServiceWorker();
        }

        function render() {
            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            // Render Connection Lines
            nodes.forEach(node => {
                if (node.parentId) {
                    const parent = nodes.find(n => n.id === node.parentId);
                    if (parent) {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.id = `edge-${node.id}`;
                        path.setAttribute('d', calculatePath(parent, node));
                        path.setAttribute('stroke', '#64748b');
                        path.setAttribute('stroke-width', '2.5');
                        path.setAttribute('fill', 'none');
                        svgLayer.appendChild(path);
                    }
                }
            });

            // Render Nodes
            nodes.forEach(node => {
                const el = document.createElement('div');
                const isSelected = (node.id === selectedNodeId);
                el.className = `node ${isSelected ? 'selected' : ''}`;
                el.id = `dom-${node.id}`;
                el.style.transform = `translate(${node.x}px, ${node.y}px)`;

                el.innerHTML = `
                    <div class="node-title">${escapeHTML(node.title)}</div>
                    <div class="node-snippet">${escapeHTML(node.description)}</div>
                `;

                el.addEventListener('pointerdown', (e) => {
                    if (isEditorOpen() || activeTouches.size >= 2) return;

                    // Double-tap to open node editor
                    const now = Date.now();
                    if (lastTapNodeId === node.id && (now - lastTapTime) < 320) {
                        clearTimeout(nodeHoldTimer);
                        selectNode(node.id, true);
                        lastTapTime = 0;
                        return;
                    }
                    lastTapNodeId = node.id;
                    lastTapTime = now;

                    const isAlreadySelected = (selectedNodeId === node.id);

                    const startDrag = () => {
                        isPanning = false;
                        isDraggingNode = true;
                        draggedNodeId = node.id;
                        activeDragPointerId = e.pointerId;
                        el.classList.add('dragging');

                        const worldPointerX = (e.clientX - panX) / scale;
                        const worldPointerY = (e.clientY - panY) / scale;
                        dragWorldOffsetX = worldPointerX - node.x;
                        dragWorldOffsetY = worldPointerY - node.y;
                    };

                    // Immediately drag if node is already selected or mouse is used
                    if (isAlreadySelected || e.pointerType === 'mouse') {
                        e.stopPropagation();
                        startDrag();
                    } else {
                        // Unselected node: select it, allow canvas pan, arm 200ms hold timer
                        selectNode(node.id, false);

                        if (activeTouches.size === 1) {
                            isPanning = true;
                            startPanX = e.clientX - panX;
                            startPanY = e.clientY - panY;
                        }

                        clearTimeout(nodeHoldTimer);
                        nodeHoldTimer = setTimeout(() => {
                            if (activeTouches.has(e.pointerId) && activeTouches.size === 1) {
                                startDrag();
                                if (navigator.vibrate) navigator.vibrate(25);
                            }
                        }, 200);
                    }
                });

                nodesLayer.appendChild(el);
            });
        }

        function calculatePath(parent, node) {
            const sX = parent.x + 100;
            const sY = parent.y + 68;
            const eX = node.x + 100;
            const eY = node.y;
            const midY = (sY + eY) / 2;
            return `M ${sX} ${sY} C ${sX} ${midY}, ${eX} ${midY}, ${eX} ${eY}`;
        }

        function updateNodeVisuals(node) {
            const el = document.getElementById(`dom-${node.id}`);
            if (el) {
                el.style.transform = `translate(${node.x}px, ${node.y}px)`;
            }

            if (node.parentId) {
                const parent = nodes.find(n => n.id === node.parentId);
                const inEdge = document.getElementById(`edge-${node.id}`);
                if (inEdge && parent) {
                    inEdge.setAttribute('d', calculatePath(parent, node));
                }
            }

            nodes.filter(n => n.parentId === node.id).forEach(child => {
                const outEdge = document.getElementById(`edge-${child.id}`);
                if (outEdge) {
                    outEdge.setAttribute('d', calculatePath(node, child));
                }
            });
        }

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }

        function selectNode(id, openEditor = false) {
            selectedNodeId = id;
            document.querySelectorAll('.node').forEach(el => {
                el.classList.toggle('selected', el.id === `dom-${id}`);
            });

            if (openEditor) {
                const node = nodes.find(n => n.id === id);
                if (node) {
                    titleInput.value = node.title;
                    descInput.value = node.description;
                    sidePanel.classList.add('open');
                }
            }

            renderSidebar();
            updateMinimap();
        }

        function deselectAll() {
            if (selectedNodeId && !isEditorOpen()) {
                selectedNodeId = null;
                document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
                updateMinimap();
                renderSidebar();
            }
        }

        function focusNodeAsHeader(node) {
            const targetScale = 1.65;
            scale = targetScale;
            panX = (window.innerWidth / 2) - ((node.x + 100) * scale);
            panY = 130 - (node.y * scale);
            
            updateTransform();
            zoomIndicator.innerText = `Zoom: ${Math.round(scale * 100)}%`;
        }

        function centerOnNode(node) {
            panX = (window.innerWidth / 2) - ((node.x + 100) * scale);
            panY = (window.innerHeight / 2) - ((node.y + 35) * scale);
            updateTransform();
        }

        function setupPointerEvents() {
            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#pip-container') || e.target.closest('#side-panel') || e.target.closest('.toolbar') || e.target.closest('#sidebar')) {
                    return;
                }

                activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activeTouches.size === 2) {
                    clearTimeout(nodeHoldTimer);
                    isPanning = false;
                    isDraggingNode = false;
                    draggedNodeId = null;
                    document.querySelectorAll('.node').forEach(el => el.classList.remove('dragging'));

                    const [t1, t2] = Array.from(activeTouches.values());
                    initialPinchDistance = Math.hypot(t2.x - t1.x, t2.y - t1.y) || 1;
                    initialPinchScale = scale;

                    const midScreenX = (t1.x + t2.x) / 2;
                    const midScreenY = (t1.y + t2.y) / 2;

                    pinchCenterWorldX = (midScreenX - panX) / scale;
                    pinchCenterWorldY = (midScreenY - panY) / scale;
                } else if (activeTouches.size === 1) {
                    const isOverNode = !!e.target.closest('.node');
                    if (!isOverNode) {
                        deselectAll();
                        isPanning = true;
                        startPanX = e.clientX - panX;
                        startPanY = e.clientY - panY;
                    }
                }
            }, { capture: true });

            window.addEventListener('pointermove', (e) => {
                if (activeTouches.has(e.pointerId)) {
                    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                }

                if (nodeHoldTimer && !isDraggingNode) {
                    const tracked = activeTouches.get(e.pointerId);
                    if (tracked && Math.hypot(e.clientX - tracked.x, e.clientY - tracked.y) > 8) {
                        clearTimeout(nodeHoldTimer);
                    }
                }

                // Two-finger pinch zoom
                if (activeTouches.size === 2) {
                    const [t1, t2] = Array.from(activeTouches.values());
                    const currentDist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
                    const currentMidX = (t1.x + t2.x) / 2;
                    const currentMidY = (t1.y + t2.y) / 2;

                    if (!initialPinchDistance) {
                        initialPinchDistance = currentDist || 1;
                        initialPinchScale = scale;
                        pinchCenterWorldX = (currentMidX - panX) / scale;
                        pinchCenterWorldY = (currentMidY - panY) / scale;
                    }

                    const targetScale = Math.min(Math.max(initialPinchScale * (currentDist / initialPinchDistance), 0.3), 3.0);

                    scale = targetScale;
                    panX = currentMidX - pinchCenterWorldX * scale;
                    panY = currentMidY - pinchCenterWorldY * scale;

                    updateTransform();
                    zoomIndicator.innerText = `Zoom: ${Math.round(scale * 100)}%`;
                    return;
                }

                // Node dragging
                if (isDraggingNode && draggedNodeId && !isEditorOpen()) {
                    const node = nodes.find(n => n.id === draggedNodeId);
                    if (node) {
                        const worldPointerX = (e.clientX - panX) / scale;
                        const worldPointerY = (e.clientY - panY) / scale;
                        node.x = worldPointerX - dragWorldOffsetX;
                        node.y = worldPointerY - dragWorldOffsetY;
                        updateNodeVisuals(node);
                        updateMinimap();
                    }
                    return;
                }

                // Canvas panning
                if (isPanning && activeTouches.size === 1 && !isEditorOpen()) {
                    panX = e.clientX - startPanX;
                    panY = e.clientY - startPanY;
                    updateTransform();
                }
            });

            const onPointerEnd = (e) => {
                clearTimeout(nodeHoldTimer);
                activeTouches.delete(e.pointerId);

                if (isDraggingNode && activeDragPointerId === e.pointerId) {
                    saveNodes();
                    isDraggingNode = false;
                    draggedNodeId = null;
                    activeDragPointerId = null;
                    document.querySelectorAll('.node').forEach(el => el.classList.remove('dragging'));
                }

                if (activeTouches.size < 2) {
                    initialPinchDistance = null;
                }
                if (activeTouches.size === 1) {
                    const remaining = Array.from(activeTouches.values())[0];
                    isPanning = true;
                    startPanX = remaining.x - panX;
                    startPanY = remaining.y - panY;
                } else if (activeTouches.size === 0) {
                    isPanning = false;
                }
            };

            window.addEventListener('pointerup', onPointerEnd);
            window.addEventListener('pointercancel', onPointerEnd);

            // Desktop Mouse Wheel Zoom
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.1;
                const newScale = e.deltaY < 0 ? Math.min(scale * zoomFactor, 3.0) : Math.max(scale / zoomFactor, 0.3);

                const mouseWorldX = (e.clientX - panX) / scale;
                const mouseWorldY = (e.clientY - panY) / scale;

                scale = newScale;
                panX = e.clientX - mouseWorldX * scale;
                panY = e.clientY - mouseWorldY * scale;

                updateTransform();
                zoomIndicator.innerText = `Zoom: ${Math.round(scale * 100)}%`;
            }, { passive: false });

            // Sidebar Controls
            document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });

            document.getElementById('btn-close-sidebar').addEventListener('click', () => {
                sidebar.classList.remove('open');
            });

            // Editor Controls
            document.getElementById('btn-close-panel').addEventListener('click', () => {
                sidePanel.classList.remove('open');
            });

            document.getElementById('btn-save').addEventListener('click', () => {
                if (selectedNodeId) {
                    const node = nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        node.title = titleInput.value.trim() || 'Untitled';
                        node.description = descInput.value.trim();
                        saveNodes();
                        render();
                        renderSidebar();
                        updateMinimap();
                    }
                }
                sidePanel.classList.remove('open');
            });

            document.getElementById('btn-delete').addEventListener('click', () => {
                if (selectedNodeId && selectedNodeId !== 'root') {
                    const toDelete = new Set([selectedNodeId]);
                    let added;
                    do {
                        added = false;
                        nodes.forEach(n => {
                            if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) {
                                toDelete.add(n.id);
                                added = true;
                            }
                        });
                    } while (added);

                    nodes = nodes.filter(n => !toDelete.has(n.id));
                    selectedNodeId = null;
                    saveNodes();
                    sidePanel.classList.remove('open');
                    render();
                    renderSidebar();
                    updateMinimap();
                }
            });

            // Toolbar Actions
            document.getElementById('btn-add').addEventListener('click', () => {
                const parentId = selectedNodeId || nodes[0].id;
                const parent = nodes.find(n => n.id === parentId);
                const newNodeId = 'node-' + Date.now();
                nodes.push({
                    id: newNodeId,
                    title: 'New Branch Node',
                    description: 'Notes & details...',
                    x: parent ? parent.x + (Math.random() * 60 - 30) : 0,
                    y: parent ? parent.y + 150 : 100,
                    parentId: parentId
                });
                saveNodes();
                render();
                renderSidebar();
                selectNode(newNodeId, true);
                updateMinimap();
            });

            document.getElementById('btn-auto-tidy').addEventListener('click', autoTidyTopDown);

            document.getElementById('btn-export').addEventListener('click', () => {
                const blob = new Blob([JSON.stringify(nodes, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'node_tree_export.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            document.getElementById('btn-import').addEventListener('click', () => {
                importFileInput.click();
            });

            importFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported) && imported.length > 0 && imported[0].id) {
                            nodes = imported;
                            selectedNodeId = null;
                            saveNodes();
                            render();
                            renderSidebar();
                            resetMinimapCamera();
                            autoTidyTopDown();
                        } else {
                            alert('Invalid node tree format.');
                        }
                    } catch (err) {
                        alert('Could not parse JSON file.');
                    }
                    importFileInput.value = '';
                };
                reader.readAsText(file);
            });
        }

        function updateTransform() {
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // PIP Minimap Functions
        function resetMinimapCamera() {
            if (nodes.length === 0) return;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            nodes.forEach(n => {
                minX = Math.min(minX, n.x);
                maxX = Math.max(maxX, n.x + 200);
                minY = Math.min(minY, n.y);
                maxY = Math.max(maxY, n.y + 70);
            });

            const pad = 80;
            const treeW = maxX - minX + pad * 2;
            const treeH = maxY - minY + pad * 2;
            const maxDimension = Math.max(treeW, treeH, 400);

            pipView.w = maxDimension;
            pipView.h = maxDimension;
            pipView.x = (minX + maxX) / 2 - pipView.w / 2;
            pipView.y = (minY + maxY) / 2 - pipView.h / 2;

            updateMinimap();
        }

        function setupPipEvents() {
            const pipTouches = new Map();

            pipContainer.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                pipTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                pipPointerMoved = false;

                const now = Date.now();
                if (pipTouches.size === 1 && (now - pipLastClickTime) < 300) {
                    pipIsDoubleTap = true;
                    if (pipSingleClickTimer) {
                        clearTimeout(pipSingleClickTimer);
                        pipSingleClickTimer = null;
                    }
                    resetMinimapCamera();
                    pipLastClickTime = 0;
                } else {
                    pipIsDoubleTap = false;
                    pipLastClickTime = now;
                }

                if (pipTouches.size === 1) {
                    isPipPanning = true;
                    pipStartPointerX = e.clientX;
                    pipStartPointerY = e.clientY;
                    pipStartViewX = pipView.x;
                    pipStartViewY = pipView.y;
                } else if (pipTouches.size === 2) {
                    isPipPanning = false;
                    if (pipSingleClickTimer) {
                        clearTimeout(pipSingleClickTimer);
                        pipSingleClickTimer = null;
                    }
                    const [t1, t2] = Array.from(pipTouches.values());
                    pipInitialPinchDist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
                    pipInitialW = pipView.w;
                    pipInitialH = pipView.h;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (pipTouches.has(e.pointerId)) {
                    pipTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                }

                if (pipTouches.size === 2 && pipInitialPinchDist) {
                    pipPointerMoved = true;
                    const [t1, t2] = Array.from(pipTouches.values());
                    const currentDist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
                    const factor = pipInitialPinchDist / currentDist;

                    const newW = pipInitialW * factor;
                    const newH = pipInitialH * factor;

                    pipView.x += (pipView.w - newW) / 2;
                    pipView.y += (pipView.h - newH) / 2;
                    pipView.w = newW;
                    pipView.h = newH;

                    updateMinimap();
                } else if (isPipPanning && pipTouches.size === 1) {
                    const rect = pipContainer.getBoundingClientRect();
                    const moveDist = Math.hypot(e.clientX - pipStartPointerX, e.clientY - pipStartPointerY);
                    if (moveDist > 6) {
                        pipPointerMoved = true;
                        if (pipSingleClickTimer) {
                            clearTimeout(pipSingleClickTimer);
                            pipSingleClickTimer = null;
                        }
                    }

                    const dx = (e.clientX - pipStartPointerX) * (pipView.w / rect.width);
                    const dy = (e.clientY - pipStartPointerY) * (pipView.h / rect.height);

                    pipView.x = pipStartViewX - dx;
                    pipView.y = pipStartViewY - dy;
                    updateMinimap();
                }
            });

            const onPipEnd = (e) => {
                // Single-click on PIP empty canvas jumps and centers main world with 280ms debounce
                if (!pipPointerMoved && !pipIsDoubleTap && isPipPanning && (e.target === pipContainer || (e.target && e.target.tagName === 'svg'))) {
                    const clientX = e.clientX;
                    const clientY = e.clientY;
                    const rect = pipContainer.getBoundingClientRect();

                    pipSingleClickTimer = setTimeout(() => {
                        const relX = (clientX - rect.left) / rect.width;
                        const relY = (clientY - rect.top) / rect.height;

                        const targetWorldX = pipView.x + relX * pipView.w;
                        const targetWorldY = pipView.y + relY * pipView.h;

                        panX = (window.innerWidth / 2) - (targetWorldX * scale);
                        panY = (window.innerHeight / 2) - (targetWorldY * scale);
                        updateTransform();
                        pipSingleClickTimer = null;
                    }, 280);
                }

                pipTouches.delete(e.pointerId);
                if (pipTouches.size < 2) pipInitialPinchDist = null;
                if (pipTouches.size === 0) {
                    isPipPanning = false;
                    pipIsDoubleTap = false;
                }
            };

            window.addEventListener('pointerup', onPipEnd);
            window.addEventListener('pointercancel', onPipEnd);

            pipContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1;

                const newW = pipView.w * zoomFactor;
                const newH = pipView.h * zoomFactor;

                pipView.x += (pipView.w - newW) / 2;
                pipView.y += (pipView.h - newH) / 2;
                pipView.w = newW;
                pipView.h = newH;

                updateMinimap();
            }, { passive: false });
        }

        function updateMinimap() {
            if (nodes.length === 0) return;

            minimapSvg.setAttribute('viewBox', `${pipView.x} ${pipView.y} ${pipView.w} ${pipView.h}`);
            minimapSvg.innerHTML = '';

            // Draw branch lines
            nodes.forEach(node => {
                if (node.parentId) {
                    const parent = nodes.find(n => n.id === node.parentId);
                    if (parent) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', parent.x + 100);
                        line.setAttribute('y1', parent.y + 35);
                        line.setAttribute('x2', node.x + 100);
                        line.setAttribute('y2', node.y + 35);
                        line.setAttribute('stroke', '#64748b');
                        line.setAttribute('stroke-width', String(Math.max(pipView.w * 0.007, 3)));
                        minimapSvg.appendChild(line);
                    }
                }
            });

            // Draw clickable node dots
            const radius = Math.max(pipView.w * 0.024, 7);
            nodes.forEach(node => {
                const isSelected = node.id === selectedNodeId;
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.style.cursor = 'pointer';

                const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                hit.setAttribute('cx', node.x + 100);
                hit.setAttribute('cy', node.y + 35);
                hit.setAttribute('r', String(radius * 2.8));
                hit.setAttribute('fill', 'transparent');

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', node.x + 100);
                circle.setAttribute('cy', node.y + 35);
                circle.setAttribute('r', String(isSelected ? radius * 1.4 : radius));
                circle.setAttribute('fill', isSelected ? '#ef4444' : '#38bdf8');
                if (isSelected) {
                    circle.setAttribute('stroke', '#ffffff');
                    circle.setAttribute('stroke-width', String(radius * 0.35));
                }

                g.appendChild(hit);
                g.appendChild(circle);

                g.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    if (pipSingleClickTimer) {
                        clearTimeout(pipSingleClickTimer);
                        pipSingleClickTimer = null;
                    }
                    selectNode(node.id, false);
                    focusNodeAsHeader(node);
                });

                minimapSvg.appendChild(g);
            });
        }

        function renderSidebar() {
            const sorted = [...nodes].sort((a, b) => a.title.localeCompare(b.title));
            sidebarList.innerHTML = '';

            sorted.forEach(node => {
                const item = document.createElement('div');
                item.className = `sidebar-item ${node.id === selectedNodeId ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="sidebar-item-title">${escapeHTML(node.title)}</div>
                    <div class="sidebar-item-desc">${escapeHTML(node.description || 'No description')}</div>
                `;

                item.addEventListener('click', () => {
                    selectNode(node.id, false);
                    centerOnNode(node);
                    sidebar.classList.remove('open');
                });

                sidebarList.appendChild(item);
            });
        }

        function autoTidyTopDown() {
            const root = nodes.find(n => n.parentId === null);
            if (!root) return;

            const levels = {};
            function assign(id, lvl) {
                if (!levels[lvl]) levels[lvl] = [];
                levels[lvl].push(id);
                nodes.filter(n => n.parentId === id).forEach(c => assign(c.id, lvl + 1));
            }
            assign(root.id, 0);

            const startX = 0;
            const startY = 100;
            const spacingX = 230;
            const spacingY = 150;

            Object.keys(levels).forEach(lvlStr => {
                const lvl = parseInt(lvlStr);
                const ids = levels[lvl];
                const totalWidth = ids.length * spacingX;
                ids.forEach((id, idx) => {
                    const n = nodes.find(x => x.id === id);
                    if (n) {
                        n.x = startX - (totalWidth / 2) + (idx * spacingX) + (spacingX / 2) - 100;
                        n.y = startY + (lvl * spacingY);
                    }
                });
            });

            saveNodes();
            render();
            resetMinimapCamera();
            panX = window.innerWidth / 2;
            panY = 80;
            updateTransform();
        }

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA ServiceWorker registered', reg))
                    .catch(err => console.error('PWA registration failed', err));
            }
        }

        init();
    </script>
</body>
</html>
